/* ============================================================
 * 应用状态管理（localStorage 持久化）
 * ============================================================ */
const STORAGE_KEY = 'gaoxiang_study_tracker_v2';
const LEGACY_KEY = 'gaoxiang_study_tracker_v1';
let state = null;

const DEFAULT_STATE = () => ({
  profile: {
    examDate: '2027-05-22',
    dailyGoalMinutes: 120,
    createdAt: new Date().toISOString().slice(0, 10),
    startDate: new Date().toISOString().slice(0, 10)
  },
  checkIns: [],         // { date, minutes, content, reflection, chapters:[id] }
  chapters: {},         // id -> { status, totalMinutes, mastery, quizCount, quizCorrect, lastStudied }
  questionStats: {      // 总体
    answered: 0,
    correct: 0,
    byChapter: {}       // ch -> { answered, correct }
  },
  wrongList: [],        // 题目快照 { chapter, q, opts, ans, explain, correctText?, wrongAnswer, date }
  pomodoro: {
    sessions: [],       // { date, startAt, duration, label, completed }
    todayCount: 0,
    todayDate: ''
  },
  currentView: 'dashboard'
});

function initChapters() {
  const map = {};
  CHAPTERS.forEach(c => {
    map[c.id] = {
      status: 'not_started',  // not_started / studying / mastered
      totalMinutes: 0,
      mastery: 0,             // 0-100
      quizCount: 0,
      quizCorrect: 0,
      lastStudied: null
    };
  });
  return map;
}

// 旧 25 章编号 → 官方 24 章编号映射（2026-09-10 对齐第 4 版目录）
const LEGACY_CH_MAP = {
  1: 1, 2: 2, 3: 3, 4: 6, 5: 7, 6: 8, 7: 9, 8: 10, 9: 11, 10: 12,
  11: 13, 12: 14, 13: 15, 14: 16, 15: 17, 16: 18, 17: 19, 18: 20,
  19: 20, 20: 20, 21: 22, 22: 23, 23: 6, 24: 24, 25: 6
};

function migrateLegacyState(parsed) {
  // 打卡记录中的章节
  (parsed.checkIns || []).forEach(ci => {
    if (Array.isArray(ci.chapters)) {
      ci.chapters = [...new Set(ci.chapters.map(id => LEGACY_CH_MAP[id] || id))];
    }
  });
  // 章节学习状态（旧 18/19/20 合并到新 20：学时/答题量累计，状态取最高）
  if (parsed.chapters) {
    const old = parsed.chapters, next = {};
    const rank = { not_started: 0, studying: 1, mastered: 2 };
    Object.keys(old).forEach(k => {
      const nk = String(LEGACY_CH_MAP[k] || k);
      const o = old[k];
      if (next[nk]) {
        next[nk].totalMinutes += o.totalMinutes || 0;
        next[nk].quizCount += o.quizCount || 0;
        next[nk].quizCorrect += o.quizCorrect || 0;
        next[nk].mastery = Math.max(next[nk].mastery || 0, o.mastery || 0);
        if (o.lastStudied && (!next[nk].lastStudied || o.lastStudied > next[nk].lastStudied)) next[nk].lastStudied = o.lastStudied;
        if ((rank[o.status] || 0) > (rank[next[nk].status] || 0)) next[nk].status = o.status;
      } else {
        next[nk] = o;
      }
    });
    parsed.chapters = next;
  }
  // 按章节答题统计
  if (parsed.questionStats && parsed.questionStats.byChapter) {
    const old = parsed.questionStats.byChapter, next = {};
    Object.keys(old).forEach(k => {
      const nk = String(LEGACY_CH_MAP[k] || k);
      if (!next[nk]) next[nk] = { answered: 0, correct: 0 };
      next[nk].answered += old[k].answered || 0;
      next[nk].correct += old[k].correct || 0;
    });
    parsed.questionStats.byChapter = next;
  }
  // 错题章节号
  (parsed.wrongList || []).forEach(w => {
    if (w.chapter != null) w.chapter = LEGACY_CH_MAP[w.chapter] || w.chapter;
  });
  return parsed;
}

function loadState() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    let isLegacy = false;
    if (!raw) {
      raw = localStorage.getItem(LEGACY_KEY);
      isLegacy = !!raw;
    }
    if (raw) {
      const parsed = JSON.parse(raw);
      if (isLegacy) migrateLegacyState(parsed);
      // 确保所有官方章节都有状态（补齐新增的第 4/5/21 章等）
      parsed.chapters = parsed.chapters || {};
      const fresh = initChapters();
      Object.keys(fresh).forEach(id => {
        if (!parsed.chapters[id]) parsed.chapters[id] = fresh[id];
      });
      if (!parsed.questionStats) parsed.questionStats = { answered: 0, correct: 0, byChapter: {} };
      if (!parsed.pomodoro) parsed.pomodoro = { sessions: [], todayCount: 0, todayDate: '' };
      if (!parsed.checkIns) parsed.checkIns = [];
      if (!parsed.wrongList) parsed.wrongList = [];
      if (isLegacy) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
        localStorage.removeItem(LEGACY_KEY);
      }
      return parsed;
    }
  } catch (e) { console.error(e); }
  const s = DEFAULT_STATE();
  s.chapters = initChapters();
  return s;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { console.error('保存失败:', e); }
}

function resetState() {
  if (!confirm('⚠️ 确认重置所有数据？此操作不可恢复。')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(LEGACY_KEY);
  state = loadState();
  render();
  alert('已重置');
}

function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `高项打卡数据_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.chapters) throw new Error('数据格式错误');
      // 旧版（25 章）备份导入时自动迁移
      if (Object.keys(data.chapters).some(k => Number(k) > 24)) migrateLegacyState(data);
      state = data;
      saveState();
      alert('导入成功！');
      render();
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
}

const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => fmtDate(new Date());
const daysBetween = (d1, d2) => Math.round((new Date(d2) - new Date(d1)) / 86400000);
const sumMinutes = (list, key = 'minutes') => list.reduce((s, x) => s + (x[key] || 0), 0);

function getStreak() {
  if (state.checkIns.length === 0) return 0;
  const dates = new Set(state.checkIns.map(c => c.date));
  const d = new Date();
  // 今日尚未打卡时从昨天起算，不中断连续天数
  if (!dates.has(fmtDate(d))) d.setDate(d.getDate() - 1);
  let streak = 0;
  while (dates.has(fmtDate(d))) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function getDaysUntilExam() {
  const exam = new Date(state.profile.examDate);
  const now = new Date();
  return Math.max(0, Math.round((exam - now) / 86400000));
}

function getTotalHours() {
  const minutes = sumMinutes(state.checkIns) +
                  state.pomodoro.sessions.filter(s => s.completed).reduce((s, x) => s + x.duration, 0);
  return Math.round(minutes / 60 * 10) / 10;
}

function getTodayCheckIn() {
  return state.checkIns.find(c => c.date === today());
}

function getWeekCheckIns() {
  const weekAgo = new Date();
  weekAgo.setDate(weekAgo.getDate() - 6);
  const wa = fmtDate(weekAgo);
  return state.checkIns.filter(c => c.date >= wa);
}

function chapterById(id) { return CHAPTERS.find(c => c.id === id); }
function questionsByChapter(id) { return QUESTIONS.filter(q => q.chapter === id); }

function updateHeaderStats() {
  document.getElementById('countdown-days').textContent = getDaysUntilExam() + ' 天';
  document.getElementById('streak-days').textContent = getStreak() + ' 天';
  document.getElementById('total-hours').textContent = getTotalHours() + ' h';
  document.getElementById('total-pomodoros').textContent = state.pomodoro.sessions.filter(s => s.completed).length;
  document.getElementById('wrong-badge').textContent = state.wrongList.length;
}

    .reduce((s, x) => s + x.duration, 0);

function getLast7Days() {

    d.setDate(d.getDate() - i);

function cycleStatus(id) {
  const ch = state.chapters[id];
  const order = ['not_started', 'studying', 'mastered'];
  const i = order.indexOf(ch.status);
  ch.status = order[(i + 1) % 3];
  if (ch.status === 'studying' && !ch.lastStudied) {
    ch.lastStudied = today();
  }
  recalcMastery(id);
  saveState();
  render();
}

function recalcMastery(id) {
  const ch = state.chapters[id];
  // 综合：状态 + 学时 + 测试正确率
  let score = 0;
  if (ch.status === 'studying') score += 20;
  if (ch.status === 'mastered') score += 50;
  if (ch.totalMinutes >= 120) score += 10;
  if (ch.totalMinutes >= 300) score += 10;
  if (ch.quizCount >= 3 && ch.quizCorrect / ch.quizCount >= 0.8) score += 20;
  ch.mastery = Math.min(100, score);
}

function setPomodoroDuration(min) {
  pomodoroDuration = min * 60;
  pomodoroSeconds = min * 60;

  render();
}

function startPomodoro() {
  if (pomodoroSeconds <= 0) pomodoroSeconds = pomodoroDuration;
  pomodoroRunning = true;
  pomodoroTimer = setInterval(() => {
    pomodoroSeconds--;
    if (pomodoroSeconds <= 0) {
      finishPomodoro();
    } else {
      updatePomodoroDisplay();
    }
  }, 1000);
  updatePomodoroDisplay();
}

function pausePomodoro() {
  pomodoroRunning = false;
  clearInterval(pomodoroTimer);
  pomodoroTimer = null;
  render();
}

function resetPomodoro() {
  pomodoroRunning = false;
  clearInterval(pomodoroTimer);
  pomodoroTimer = null;
  pomodoroSeconds = pomodoroDuration;
  render();
}

function finishPomodoro() {
  pomodoroRunning = false;
  if (pomodoroTimer) clearInterval(pomodoroTimer);
  pomodoroTimer = null;
  const elapsed = pomodoroDuration - pomodoroSeconds;
  const actualMin = Math.max(1, Math.round(elapsed / 60));
  state.pomodoro.sessions.push({
    date: today(),
    startAt: fmtDate(new Date()) + ' ' + new Date().toTimeString().slice(0, 5),
    duration: actualMin,
    label: '学习',
    completed: true
  });
  pomodoroSeconds = pomodoroDuration;
  saveState();
  render();
  alert(`🎉 番茄完成！记录 ${actualMin} 分钟学时。`);
}

function updatePomodoroDisplay() {
  const m = Math.floor(pomodoroSeconds / 60);
  const s = pomodoroSeconds % 60;
  const display = document.querySelector('.absolute.inset-0 .text-5xl');
  if (display) display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const status = document.querySelector('.absolute.inset-0 .text-xs');
  if (status) status.innerHTML = '<span class="text-emerald-400 pulse-dot">●</span> 进行中';
}

function submitCheckIn(e) {
  e.preventDefault();
  const minutes = parseInt(document.getElementById('ci-minutes').value);
  const content = document.getElementById('ci-content').value.trim();
  const reflection = document.getElementById('ci-reflection').value.trim();
  const chapters = Array.from(document.querySelectorAll('.ci-ch:checked')).map(x => parseInt(x.value));

  if (!minutes || minutes < 1) return alert('请填写学习时长');

  const existing = getTodayCheckIn();
  if (existing) {
    existing.minutes += minutes;
    existing.content = content || existing.content;
    existing.reflection = reflection || existing.reflection;
    if (chapters.length > 0) {
      existing.chapters = Array.from(new Set([...(existing.chapters || []), ...chapters]));
    }
  } else {
    state.checkIns.push({
      date: today(),
      minutes,
      content,
      reflection,
      chapters
    });
  }

  // 更新章节学时
  chapters.forEach(id => {
    if (state.chapters[id]) {
      state.chapters[id].totalMinutes += minutes;
      if (state.chapters[id].status === 'not_started') state.chapters[id].status = 'studying';
      state.chapters[id].lastStudied = today();
      recalcMastery(id);
    }
  });

  saveState();
  alert(`✅ 打卡成功！记录 ${minutes} 分钟${chapters.length > 0 ? '，已关联 ' + chapters.length + ' 个章节' : ''}`);
  render();
}

 * 视图：章节测试（quiz 引擎）
 * ============================================================ */
let quizSession = null;

function renderQuiz(chapterId = null) {
  if (quizSession && !quizSession.finished) {
    return renderQuizInProgress();
  }

  return `
    <h2 class="text-2xl font-bold mb-6">📝 章节测试</h2>

    <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 mb-6">

        <button onclick="startQuiz('random10')" class="bg-indigo-600 hover:bg-indigo-500 rounded-lg p-4 text-left">
          <div class="text-lg mb-1">🎲 随机 10 题</div>
          <div class="text-xs opacity-75">全章节随机抽题</div>

        </button>
        <button onclick="startQuiz('critical')" class="bg-rose-600 hover:bg-rose-500 rounded-lg p-4 text-left">
          <div class="text-lg mb-1">⭐ 高频考点</div>
          <div class="text-xs opacity-75">计算题 + 绩效域 + 法规（15 题）</div>
        </button>

    </div>

      <h3 class="font-semibold mb-3">按章节练习</h3>
      <div class="grid grid-cols-3 md:grid-cols-5 gap-2">
        ${CHAPTERS.map(c => {
          const cnt = questionsByChapter(c.id).length;
          return `<button onclick="openChapterQuiz(${c.id})" class="bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded-lg p-3 text-left">
            <div class="text-xs text-slate-400">第 ${c.id} 章</div>
            <div class="text-sm font-medium truncate">${c.name}</div>
            <div class="text-xs text-indigo-400 mt-1">${cnt} 题</div>
          </button>`;
        }).join('')}
      </div>
    </div>
  `;
}

function openChapterQuiz(id) {
  quizSession = null;
  renderQuiz(id);
  startQuiz('chapter:' + id);
}

function startQuiz(mode) {
  let pool = [];
  if (mode.startsWith('chapter:')) {
    const ch = parseInt(mode.split(':')[1]);
    pool = questionsByChapter(ch);
  } else if (mode === 'random10') {
    pool = [...QUESTIONS].sort(() => Math.random() - 0.5).slice(0, 10);
  } else if (mode === 'wrong') {
    if (state.wrongList.length === 0) return alert('错题本为空，先去刷题吧！');
    pool = state.wrongList.map(w => {
      const src = (Array.isArray(w.opts) && w.opts.length >= 2) ? w :
        QUESTIONS.find(q => q.chapter === w.chapter && q.q.startsWith(String(w.q).slice(0, 30)));
      if (!src) return null;
      return { chapter: src.chapter, q: src.q, opts: src.opts, ans: src.ans, explain: src.explain || src.explain2 || '' };
    }).filter(Boolean);
  } else if (mode === 'critical') {
    // 高频考点：计算题（进度10/成本11/风险15/科学基础21）+ 绩效域18 + 法规24
    pool = QUESTIONS.filter(q => [10, 11, 15, 18, 21, 24].includes(q.chapter));
    pool = pool.sort(() => Math.random() - 0.5).slice(0, 15);
  }

  if (pool.length === 0) return alert('该模式暂无可用的题目');

  quizSession = {
    mode,
    questions: pool,
    currentIdx: 0,
    answers: new Array(pool.length).fill(null),
    finished: false
  };
  render();
}

function renderQuizInProgress() {
  const s = quizSession;
  const i = s.currentIdx;
  const q = s.questions[i];
  const ans = s.answers[i];
  const ch = chapterById(q.chapter);

  return `
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">第 ${i + 1} / ${s.questions.length} 题</h2>
      <div class="flex gap-2">
        <button onclick="exitQuiz()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm">退出</button>
        ${s.answers.filter(x => x !== null).length > 0 ? `<button onclick="finishQuiz()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded text-sm">交卷 (${s.answers.filter(x => x !== null).length}/${s.questions.length})</button>` : ''}
      </div>
    </div>

    <div class="w-full bg-slate-700 rounded-full h-1.5 mb-4">
      <div class="bg-indigo-500 h-1.5 rounded-full" style="width:${(i/s.questions.length)*100}%"></div>
    </div>

    <div class="bg-slate-800 rounded-xl p-5 border border-slate-700">
      <div class="text-xs text-slate-400 mb-2">第 ${q.chapter} 章 · ${ch.name} · 权重 ${ch.weight}</div>
      <div class="text-base font-medium mb-4">${q.q}</div>
      <div class="space-y-2 mb-4">
        ${q.opts.map((opt, idx) => {
          const selected = ans === idx;
          const isCorrect = ans !== null && idx === q.ans;
          const isWrong = ans !== null && selected && idx !== q.ans;
          let cls = 'quiz-opt';
          if (ans !== null) {
            cls += ' disabled cursor-default';
            if (isCorrect) cls += ' correct';
            else if (isWrong) cls += ' wrong';
            else cls += ' opacity-60';
          }
          return `<div onclick="${ans === null ? `selectAnswer(${idx})` : ''}" class="${cls} border-2 border-slate-700 rounded-lg p-3 cursor-pointer transition">
            <span class="font-mono mr-2">${'ABCD'[idx]}.</span>${opt}
          </div>`;
        }).join('')}
      </div>
      ${ans !== null ? `
        <div class="bg-slate-900 rounded-lg p-3 text-sm">
          <div class="${s.answers[i] === q.ans ? 'text-emerald-400' : 'text-rose-400'} font-semibold mb-1">
            ${s.answers[i] === q.ans ? '✓ 回答正确' : `✗ 回答错误（正确答案：${'ABCD'[q.ans]}）`}
          </div>
          <div class="text-slate-300 text-xs">${q.explain || q.explain2 || ''}</div>
        </div>
        <div class="flex justify-between mt-4">
          <button onclick="prevQuestion()" ${i === 0 ? 'disabled' : ''} class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded disabled:opacity-30">上一题</button>
          <button onclick="nextQuestion()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded">${i === s.questions.length - 1 ? '查看结果' : '下一题'}</button>
        </div>
      ` : ''}
    </div>
  `;
}

function selectAnswer(idx) {
  quizSession.answers[quizSession.currentIdx] = idx;
  render();
}

function nextQuestion() {
  if (quizSession.currentIdx < quizSession.questions.length - 1) {
    quizSession.currentIdx++;
  } else {
    finishQuiz();
  }
  render();
}

function prevQuestion() {
  if (quizSession.currentIdx > 0) quizSession.currentIdx--;
  render();
}

function finishQuiz() {
  const s = quizSession;
  let correct = 0;
  s.questions.forEach((q, i) => {
    if (s.answers[i] === q.ans) correct++;
    // 记录统计
    state.questionStats.answered++;
    if (s.answers[i] === q.ans) {
      state.questionStats.correct++;
      state.questionStats.byChapter[q.chapter] = state.questionStats.byChapter[q.chapter] || { answered: 0, correct: 0 };
      state.questionStats.byChapter[q.chapter].answered++;
      state.questionStats.byChapter[q.chapter].correct++;
    } else {
      state.questionStats.byChapter[q.chapter] = state.questionStats.byChapter[q.chapter] || { answered: 0, correct: 0 };
      state.questionStats.byChapter[q.chapter].answered++;
      // 错题入库（存题目快照；去重：同一题只保留最后一次错答）
      const idx = state.wrongList.findIndex(w => w.chapter === q.chapter && w.q === q.q);
      if (idx >= 0) state.wrongList.splice(idx, 1);
      state.wrongList.push({ chapter: q.chapter, q: q.q, opts: q.opts, ans: q.ans, explain: q.explain || q.explain2 || '', wrongAnswer: s.answers[i], date: today() });
    }
    // 更新章节测试统计
    const ch = state.chapters[q.chapter];
    ch.quizCount++;
    if (s.answers[i] === q.ans) ch.quizCorrect++;
    recalcMastery(q.chapter);
  });

  s.finished = true;
  saveState();
  renderQuizResult(correct, s.questions.length);
}

function renderQuizResult(correct, total) {
  const pct = Math.round(correct / total * 100);
  const grade = pct >= 90 ? '优秀' : pct >= 75 ? '良好' : pct >= 60 ? '及格' : '需加油';
  const color = pct >= 75 ? 'emerald' : pct >= 60 ? 'amber' : 'rose';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="max-w-2xl mx-auto bg-slate-800 rounded-xl p-8 border border-slate-700 text-center">
      <div class="text-6xl font-bold text-${color}-400 mb-2">${pct}</div>
      <div class="text-slate-400 mb-6">分 · ${grade}</div>
      <div class="text-lg mb-6">答对 <span class="text-emerald-400 font-bold">${correct}</span> / ${total} 题</div>
      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-slate-900 rounded-lg p-3">
          <div class="text-xs text-slate-400">正确率</div>
          <div class="text-xl font-bold text-${color}-400">${pct}%</div>
        </div>
        <div class="bg-slate-900 rounded-lg p-3">
          <div class="text-xs text-slate-400">错题已加入错题本</div>
          <div class="text-xl font-bold text-rose-400">${total - correct} 题</div>
        </div>
      </div>
      <div class="flex gap-3">
        <button onclick="quizSession=null;render()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg py-2.5">返回测试菜单</button>
        <button onclick="startQuiz(quizSession.mode)" class="flex-1 bg-emerald-600 hover:bg-emerald-500 rounded-lg py-2.5">再做一遍</button>
      </div>
    </div>
  `;
}

function exitQuiz() {
  if (confirm('退出当前测试？（已答题不计入统计）')) {
    quizSession = null;
    render();
  }
}

        <button onclick="submitCalc()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded">提交</button>
        <button onclick="genCalc()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded">换一题</button>
        ${p.submitted ? `<button onclick="revealCalc()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded">查看答案</button>` : ''}
      </div>
      ${p.submitted ? `
        <div class="mt-4 bg-slate-900 rounded-lg p-4">
          <div class="${correct ? 'text-emerald-400' : 'text-rose-400'} font-semibold mb-2">
            ${correct ? '✓ 正确！' : `✗ 错误，正确答案是 ${p.answer}${p.unit || ''}`}
          </div>
          <div class="text-sm text-slate-300">📝 解析：${p.solution}</div>
        </div>
      ` : ''}
    </div>
  `;
}

function genCalc() {
  if (calcType === 'cpm') {
    // 生成一个简单的串行+并行活动网络
    const activities = [
      { id: 'A', dur: 3, succ: ['B', 'C'] },
      { id: 'B', dur: 4, succ: ['D'] },
      { id: 'C', dur: 2, succ: ['D'] },
      { id: 'D', dur: 5, succ: ['E'] },
      { id: 'E', dur: 3, succ: [] }
    ];
    // 计算关键路径
    const es = { A: 0 }, ef = { A: 3 };
    const order = ['B', 'C', 'D', 'E'];
    order.forEach(id => {
      const a = activities.find(x => x.id === id);
      const preds = activities.filter(x => x.succ.includes(id));
      es[id] = Math.max(...preds.map(p => ef[p.id]));
      ef[id] = es[id] + a.dur;
    });
    const criticalPath = order.filter(id => {
      const a = activities.find(x => x.id === id);
      const preds = activities.filter(x => x.succ.includes(id));
      const ls = preds.length === 0 ? es[id] : Math.max(...preds.map(p => ef[p.id])) - a.dur;
      return ef[id] - es[id] > 0 || id === 'A';
    });
    const cp = ['A', ...criticalPath];
    const totalDur = ef['E'];

    calcProblem = {
      title: '🔗 关键路径计算',
      type: 'cpm',
      question: `某项目有 A、B、C、D、E 5 个活动,持续时间分别为 3、4、2、5、3 周。
依赖关系: A 是 B、C 的前置; B、C 都是 D 的前置; D 是 E 的前置。求关键路径和总工期。`,
      params: `A→B (4w), A→C (2w), B→D (5w), C→D (5w), D→E (3w)
并行路径: A-B-D-E = 3+4+5+3 = ${3+4+5+3} 周
        A-C-D-E = 3+2+5+3 = ${3+2+5+3} 周`,
      unit: ' 周',
      userAns: '',
      answer: totalDur,
      check: a => Math.abs(parseFloat(a) - totalDur) < 0.5,
      solution: `所有路径:
  A-B-D-E = 3+4+5+3 = 15 周
  A-C-D-E = 3+2+5+3 = 13 周
关键路径 = A-B-D-E, 总工期 = 15 周。
方法: 列出所有路径,选最长的就是关键路径。`,
      submitted: false
    };
  } else if (calcType === 'evm') {
    // 生成 EVM 题目
    const bac = [80, 100, 120, 150, 200][Math.floor(Math.random() * 5)];
    const ev = Math.round(bac * (0.3 + Math.random() * 0.2));
    const ac = Math.round(ev * (0.85 + Math.random() * 0.3));
    const pv = ev + 10 + Math.round(Math.random() * 20);
    const cpi = (ev / ac).toFixed(2);
    const eac = Math.round(bac / (ev / ac));

    calcProblem = {
      title: '💰 挣值分析 (EVM)',
      type: 'evm',
      question: `某项目 BAC(完工预算) = ${bac} 万,当前统计: PV = ${pv}, EV = ${ev}, AC = ${ac} 万。
求完工估算 EAC。`,
      params: `BAC = ${bac} 万
PV  = ${pv} 万
EV  = ${ev} 万
AC  = ${ac} 万
CPI = EV/AC = ${cpi}
公式: EAC = BAC / CPI`,
      unit: ' 万（结果取整数）',
      userAns: '',
      answer: eac,
      check: a => Math.abs(parseFloat(a) - eac) <= 1,
      solution: `步骤:
1) CPI = EV/AC = ${ev}/${ac} ≈ ${cpi}
2) EAC = BAC/CPI = ${bac}/${cpi} ≈ ${eac} 万
含义: 按当前效率,项目最终将花费 ${eac} 万,超预算 ${eac - bac} 万。
建议: 审计低效原因,考虑赶工或范围调整。`,
      submitted: false
    };
  } else if (calcType === 'emv') {
    // EMV 决策树
    const prob1 = 0.3 + Math.round(Math.random() * 5) / 10;
    const gain1 = 100 + Math.round(Math.random() * 100);
    const prob2 = 0.4 + Math.round(Math.random() * 4) / 10;
    const gain2 = 80 + Math.round(Math.random() * 50);
    const emv1 = Math.round(prob1 * gain1 + (1 - prob1) * 0);
    const emv2 = Math.round(prob2 * gain2 + (1 - prob2) * 0);

    calcProblem = {
      title: '🎲 期望货币值 (EMV)',
      type: 'emv',
      question: `项目有两个方案:
方案 A: 成功概率 ${(prob1*100)}%,成功收益 ${gain1} 万,失败收益 0
方案 B: 成功概率 ${(prob2*100)}%,成功收益 ${gain2} 万,失败收益 0
哪个方案更优?给出更优方案的 EMV。`,
      params: `方案 A: ${(prob1*100)}% × ${gain1} = ${(prob1*gain1).toFixed(1)} 万
方案 B: ${(prob2*100)}% × ${gain2} = ${(prob2*gain2).toFixed(1)} 万`,
      unit: ' 万（保留整数）',
      userAns: '',
      answer: Math.max(emv1, emv2),
      check: a => Math.abs(parseFloat(a) - Math.max(emv1, emv2)) <= 1,
      solution: `EMV 计算:
EMV_A = ${prob1} × ${gain1} = ${(prob1*gain1).toFixed(1)} 万
EMV_B = ${prob2} × ${gain2} = ${(prob2*gain2).toFixed(1)} 万
EMV_A ${emv1 > emv2 ? '>' : emv1 < emv2 ? '<' : '='} EMV_B
更优方案 = ${emv1 > emv2 ? 'A' : emv2 > emv1 ? 'B' : '两者相等'}
最优 EMV = ${Math.max(emv1, emv2)} 万`,
      submitted: false
    };
  }

  render();
}

function submitCalc() {
  const input = document.getElementById('calc-input');
  if (!input) return;
  calcProblem.userAns = input.value;
  calcProblem.submitted = true;
  // 记录到题目统计（正确率也算）
  const correct = calcProblem.check(calcProblem.userAns);
  state.questionStats.answered++;
  if (correct) state.questionStats.correct++;
  if (!correct) {
    // 计算题错题快照入库（去重）
    const wch = calcProblem.type === 'cpm' ? 10 : calcProblem.type === 'evm' ? 11 : 15;
    const wIdx = state.wrongList.findIndex(w => w.chapter === wch && w.q === calcProblem.question);
    if (wIdx >= 0) state.wrongList.splice(wIdx, 1);
    state.wrongList.push({
      chapter: wch,
      q: calcProblem.question,
      opts: [],
      ans: -1,
      explain: calcProblem.solution,
      correctText: `${calcProblem.answer}${calcProblem.unit || ''}`,
      wrongAnswer: calcProblem.userAns,
      date: today()
    });
  }
  saveState();
  render();
}

function revealCalc() {
  if (!calcProblem) return;
  alert(`答案: ${calcProblem.answer}${calcProblem.unit || ''}\n\n${calcProblem.solution}`);
}

let examSession = null;

function renderExam() {

        </div>

    </div>
  `;
}

function startExam() {
  const pool = [...QUESTIONS].sort(() => Math.random() - 0.5).slice(0, 30);
  examSession = {
    questions: pool,
    answers: new Array(30).fill(null),
    currentIdx: 0,
    startAt: Date.now(),
    durationMs: 40 * 60 * 1000,
    finished: false
  };
  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(checkExamTime, 1000);
  render();
}

let examTimer = null;

function checkExamTime() {
  if (!examSession || examSession.finished) return;
  const elapsed = Date.now() - examSession.startAt;
  const remain = examSession.durationMs - elapsed;
  const display = document.getElementById('exam-timer');
  if (display) {
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (remain < 60000) display.classList.add('text-rose-400');
  }
  if (remain <= 0) {
    clearInterval(examTimer);
    finishExam();
  }
}

function renderExamInProgress() {
  const s = examSession;
  const i = s.currentIdx;
  const q = s.questions[i];
  const ans = s.answers[i];
  const answered = s.answers.filter(x => x !== null).length;
  const elapsed = Math.round((Date.now() - s.startAt) / 60000);

  return `
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">综合知识模拟 · 第 ${i+1}/${s.questions.length} 题</h2>
      <div class="flex gap-3 items-center">
        <span class="text-sm">已答 <span class="text-emerald-400 font-bold">${answered}</span>/${s.questions.length}</span>
        <span class="text-sm">⏱ 已用时 <span class="text-amber-400">${elapsed}</span> 分钟</span>
        <span class="text-sm font-mono">剩余 <span id="exam-timer" class="text-indigo-400 font-bold">--:--</span></span>
        <button onclick="if(confirm('确认交卷？'))finishExam()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded text-sm">交卷</button>
      </div>
    </div>

    <div class="bg-slate-800 rounded-xl p-5 border border-slate-700">
      <div class="text-xs text-slate-400 mb-2">第 ${q.chapter} 章 · 权重 ${chapterById(q.chapter).weight}</div>
      <div class="text-base font-medium mb-4">${q.q}</div>
      <div class="space-y-2">
        ${q.opts.map((opt, idx) => {
          const selected = ans === idx;
          return `<div onclick="examSelectAnswer(${idx})" class="border-2 ${selected ? 'border-indigo-500 bg-indigo-500/15' : 'border-slate-700 hover:border-slate-500'} rounded-lg p-3 cursor-pointer transition">
            <span class="font-mono mr-2">${'ABCD'[idx]}.</span>${opt}
          </div>`;
        }).join('')}
      </div>
      <div class="flex justify-between mt-4">
        <button onclick="examPrev()" ${i === 0 ? 'disabled' : ''} class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded disabled:opacity-30">上一题</button>
        <button onclick="examNext()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded">${i === s.questions.length-1 ? '已答完 · 交卷' : '下一题'}</button>
      </div>
    </div>

    <div class="mt-4 bg-slate-800 rounded-xl p-3 border border-slate-700">
      <div class="text-xs text-slate-400 mb-2">答题卡（点击快速跳转）</div>
      <div class="flex flex-wrap gap-1.5">
        ${s.answers.map((a, idx) => {
          const cur = idx === i ? 'border-indigo-500 bg-indigo-500/20' :
                      a !== null ? 'border-emerald-500 bg-emerald-500/10' : 'border-slate-700';
          return `<button onclick="examJump(${idx})" class="${cur} border w-9 h-9 rounded text-xs">${idx+1}</button>`;
        }).join('')}
      </div>
    </div>
  `;
}

function examSelectAnswer(idx) {
  examSession.answers[examSession.currentIdx] = idx;
  render();
}

function examNext() {
  if (examSession.currentIdx < examSession.questions.length - 1) {
    examSession.currentIdx++;
    render();
  } else {
    if (confirm('已答完所有题目，确认交卷？')) finishExam();
  }
}

function examPrev() {
  if (examSession.currentIdx > 0) examSession.currentIdx--;
  render();
}

function examJump(idx) {
  examSession.currentIdx = idx;
  render();
}

function finishExam() {
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  examSession.finished = true;
  let correct = 0;
  examSession.questions.forEach((q, i) => {
    if (examSession.answers[i] === q.ans) correct++;
    state.questionStats.answered++;
    if (examSession.answers[i] === q.ans) state.questionStats.correct++;
    const ch = state.chapters[q.chapter];
    ch.quizCount++;
    if (examSession.answers[i] === q.ans) ch.quizCorrect++;
    if (examSession.answers[i] !== q.ans) {
      // 快照入库 + 去重（与章节测试口径一致）
      const wIdx = state.wrongList.findIndex(w => w.chapter === q.chapter && w.q === q.q);
      if (wIdx >= 0) state.wrongList.splice(wIdx, 1);
      state.wrongList.push({ chapter: q.chapter, q: q.q, opts: q.opts, ans: q.ans, explain: q.explain || q.explain2 || '', wrongAnswer: examSession.answers[i], date: today() });
    }
    recalcMastery(q.chapter);
  });
  saveState();
  renderExamResult(correct, examSession.questions.length);
}

function renderExamResult(correct, total) {
  const pct = Math.round(correct / total * 100);
  const passed = correct >= 18;
  const color = passed ? 'emerald' : 'rose';

  const main = document.getElementById('main');
  main.innerHTML = `

      <div class="text-sm text-slate-400 mb-2">综合知识模拟成绩</div>

      <div class="text-lg mb-6">正确率 ${pct}% · ${passed ? '🎉 合格' : '❌ 未达 60% 合格线'}</div>
      <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-slate-900 rounded-lg p-3">
          <div class="text-xs text-slate-400">答对</div>
          <div class="text-2xl font-bold text-emerald-400">${correct}</div>
        </div>
        <div class="bg-slate-900 rounded-lg p-3">
          <div class="text-xs text-slate-400">答错</div>
          <div class="text-2xl font-bold text-rose-400">${total - correct}</div>

        <div class="bg-slate-900 rounded-lg p-3">
          <div class="text-xs text-slate-400">用时</div>
          <div class="text-2xl font-bold text-amber-400">${Math.round((Date.now()-examSession.startAt)/60000)} 分钟</div>

      </div>
      <div class="flex gap-3">
        <button onclick="examSession=null;render()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg py-2.5">返回菜单</button>
        <button onclick="startExam()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 rounded-lg py-2.5">再做一套</button>
      </div>
    </div>
  `;
}

// 错题条目 → 可展示的题目对象（新版快照优先；旧数据回退题库匹配）
function resolveWrongQuestion(w) {
  if (w && w.q && w.ans !== undefined) return w;
  return QUESTIONS.find(q => q.chapter === w.chapter && q.q.startsWith(String(w.q).slice(0, 30))) || null;
}

function renderWrong() {
  if (state.wrongList.length === 0) {
    return `
      <h2 class="text-2xl font-bold mb-6">❌ 错题本</h2>
      <div class="bg-slate-800 rounded-xl p-12 border border-slate-700 text-center">
        <div class="text-6xl mb-4">🎉</div>
        <div class="text-lg mb-2">错题本还是空的</div>
        <div class="text-sm text-slate-400 mb-6">完成测试或计算题后，错题会自动加入这里</div>
        <button onclick="nav('quiz')" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg">去刷题</button>
      </div>
    `;
  }

  return `
    <h2 class="text-2xl font-bold mb-2">❌ 错题本（${state.wrongList.length} 道）</h2>
    <p class="text-sm text-slate-400 mb-6">错题是提分最快的方式。建议每天重做 5~10 道，5 天一轮回。</p>

    <div class="mb-4 flex gap-2">
      <button onclick="startQuiz('wrong')" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded">📝 重做全部</button>
      <button onclick="clearWrongByChapter()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded">🗑 按章节清理</button>
    </div>

    <div class="space-y-2">
      ${state.wrongList.slice().reverse().map((w, idx) => {
        const q = resolveWrongQuestion(w);
        const ch = chapterById(w.chapter);
        const isCalc = q && Array.isArray(q.opts) && q.opts.length === 0;
        const yourAns = (w.wrongAnswer !== null && w.wrongAnswer !== undefined)
          ? ((q && q.opts && q.opts.length) ? 'ABCD'[w.wrongAnswer] + '. ' + q.opts[w.wrongAnswer] : w.wrongAnswer)
          : '未作答';
        const correctAns = w.correctText || (q && q.opts && q.opts.length ? 'ABCD'[q.ans] + '. ' + q.opts[q.ans] : '—');
        return `<div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
          <div class="flex justify-between items-start mb-2">
            <div class="text-xs">
              <span class="bg-rose-600 px-2 py-0.5 rounded">第 ${w.chapter} 章</span>
              <span class="text-slate-400 ml-2">${ch ? ch.name + ' · ' + ch.weight : ''}${isCalc ? ' · 计算题' : ''}</span>
            </div>
            <button onclick="removeWrong(${state.wrongList.length - 1 - idx})" class="text-xs text-slate-500 hover:text-rose-400">移除</button>
          </div>
          <div class="text-sm mb-2">${w.q}</div>
          <div class="text-xs text-slate-400">
            你的答案: <span class="text-rose-400">${yourAns}</span>
            正确答案: <span class="text-emerald-400">${correctAns}</span>
          </div>
          <div class="text-xs text-slate-500 mt-2 italic">${q ? (q.explain || '') : '（旧版数据，题目原文缺失，可直接移除）'}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function removeWrong(idx) {
  state.wrongList.splice(idx, 1);
  saveState();
  render();
}

function clearWrongByChapter() {
  const groups = {};
  state.wrongList.forEach(w => {
    groups[w.chapter] = (groups[w.chapter] || 0) + 1;
  });
  const msg = Object.entries(groups).map(([ch, n]) => `第${ch}章: ${n}题`).join('\n');
  if (!confirm(`按章节清理错题：\n${msg}\n\n确定要清空吗？`)) return;
  state.wrongList = [];
  saveState();
  render();
}

function renderMonthHeatmap(monthDate) {
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const days = lastDay.getDate();
  const startWeekday = firstDay.getDay();

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += '<div class="heatmap-cell" style="background:transparent"></div>';
  for (let d = 1; d <= days; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ci = state.checkIns.find(c => c.date === dateStr);
    const pomo = state.pomodoro.sessions.filter(s => s.completed && s.date === dateStr).reduce((s,x)=>s+x.duration, 0);
    const total = (ci ? ci.minutes : 0) + pomo;
    let bg = '#1e293b';
    if (total > 0) bg = `rgba(16, 185, 129, ${Math.min(1, total / 180 + 0.2)})`;
    const future = new Date(dateStr) > new Date();
    cells += `<div class="heatmap-cell" style="background:${bg}${future?';opacity:0.3':''}" title="${dateStr}: ${total}分钟"></div>`;
  }

  return `
    <div>
      <div class="text-sm font-semibold mb-2">${year} 年 ${month + 1} 月</div>
      <div class="flex items-center gap-0.5 text-xs text-slate-400 mb-1">
        ${['日','一','二','三','四','五','六'].map(d => `<div style="width:14px" class="text-center">${d}</div>`).join('')}
      </div>
      <div class="flex flex-wrap gap-0.5">${cells}</div>
    </div>
  `;
}

function renderStatsCharts() {
  // 雷达图
  const r = document.getElementById('radarChart');
  if (r) {
    new Chart(r, {
      type: 'radar',
      data: {
        labels: CHAPTERS.map(c => `第${c.id}章`),
        datasets: [{
          label: '掌握度',
          data: CHAPTERS.map(c => state.chapters[c.id].mastery),
          backgroundColor: 'rgba(99, 102, 241, 0.2)',
          borderColor: 'rgb(99, 102, 241)',
          pointBackgroundColor: 'rgb(99, 102, 241)'
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: { r: { ticks: { color: '#94a3b8', backdropColor: 'transparent' }, grid: { color: '#334155' }, pointLabels: { font: { size: 9 }, color: '#cbd5e1' }, suggestedMin: 0, suggestedMax: 100 } }
      }
    });
  }

  // 月度图
  const m = document.getElementById('monthChart');
  if (m) {
    const months = [];
    const data = [];
    const t = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(t.getFullYear(), t.getMonth() - i, 1);
      const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      months.push(ym.slice(2));
      const min = state.checkIns.filter(c => c.date.startsWith(ym)).reduce((s,x) => s + x.minutes, 0);
      data.push(Math.round(min / 60 * 10) / 10);
    }
    new Chart(m, {
      type: 'bar',
      data: { labels: months, datasets: [{ label: '小时', data, backgroundColor: 'rgba(245, 158, 11, 0.7)', borderRadius: 4 }] },
      options: {
        plugins: { legend: { display: false } },
        scales: { y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, x: { ticks: { color: '#94a3b8' }, grid: { display: false } } }
      }
    });
  }

  // 章节测试表现
  const cp = document.getElementById('chapterPerfChart');
  if (cp) {
    new Chart(cp, {
      type: 'bar',
      data: {
        labels: CHAPTERS.map(c => `第${c.id}章`),
        datasets: [
          { label: '答对', data: CHAPTERS.map(c => state.questionStats.byChapter[c.id]?.correct || 0), backgroundColor: 'rgba(16, 185, 129, 0.7)' },
          { label: '答错', data: CHAPTERS.map(c => (state.questionStats.byChapter[c.id]?.answered || 0) - (state.questionStats.byChapter[c.id]?.correct || 0)), backgroundColor: 'rgba(239, 68, 68, 0.7)' }
        ]
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { labels: { color: '#cbd5e1' } } },
        scales: { x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, y: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { display: false } } }
      }
    });
  }
}

function saveSettings(e) {
  e.preventDefault();
  state.profile.examDate = document.getElementById('set-exam-date').value;
  state.profile.dailyGoalMinutes = parseInt(document.getElementById('set-goal').value);
  saveState();
  alert('✅ 已保存');
  render();
}

/* ============================================================
 * 视图调度
 * ============================================================ */
function nav(view) {
  state.currentView = view;
  quizSession = null;
  if (examTimer && view !== 'exam') { clearInterval(examTimer); examTimer = null; }
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.nav === view);
  });
  render();
}

function render() {
  updateHeaderStats();
  const main = document.getElementById('main');
  let html = '';
  switch (state.currentView) {
    case 'dashboard': html = renderDashboard(); break;
    case 'chapters': html = renderChapters(); break;
    case 'pomodoro': html = renderPomodoro(); break;
    case 'checkin': html = renderCheckIn(); break;
    case 'quiz': html = renderQuiz(); break;
    case 'calc': html = renderCalc(); break;
    case 'exam': html = renderExam(); break;
    case 'wrong': html = renderWrong(); break;
    case 'calendar': html = renderCalendar(); break;
    case 'stats': html = renderStats(); break;
    case 'settings': html = renderSettings(); break;
  }
  main.innerHTML = html;

  // 渲染图表
  if (state.currentView === 'dashboard') renderWeekChart();
  if (state.currentView === 'stats') setTimeout(renderStatsCharts, 50);
  if (state.currentView === 'exam' && examSession && !examSession.finished) {
    // 切换视图返回考试时重建计时器，保证倒计时逐秒刷新、到时自动交卷
    if (!examTimer) examTimer = setInterval(checkExamTime, 1000);
    setTimeout(checkExamTime, 50);
  }
}

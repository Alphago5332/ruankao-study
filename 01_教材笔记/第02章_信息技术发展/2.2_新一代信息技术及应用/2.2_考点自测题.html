<script>
const QUESTIONS = [
  // 模块A 物联网 (1-5)
  { m: "A·物联网", q: "关于物联网，下列表述错误的是（　）。",
    o: ["物联网是指通过信息传感设备，按约定的协议将任何物品与互联网相连接，进行信息交换和通信，以实现智能化识别、定位、跟踪、监控和管理的网络","物联网主要解决物品与物品（T2T）、人与物品（H2T）、人与人（H2H）之间的互连","许多学者讨论物联网时会引入 M2M 的概念，可解释为人与人、人与机器或机器与机器","物联网的定义要求把服务器、交换机等 IT 设备作为唯一接入对象，不包含普通物品"], a: 3,
    e: "教材 2.2.1 原文：物联网（The Internet of Things）是指通过【信息传感设备】，按【约定的协议】将【任何物品】与互联网相连接，进行【信息交换和通信】，以实现【智能化识别、定位、跟踪、监控和管理】的网络。它主要解决【物品与物品（Thing to Thing，T2T）· 人与物品（Human to Thing，H2T）· 人与人（Human to Human，H2H）】之间的互连；M2M 可解释为【人与人（Man to Man）· 人与机器（Man to Machine）· 机器与机器（Machine to Machine）】。D 把定义里的「任何物品」偷换成「服务器、交换机等 IT 设备」，正好说反。" },
  { m: "A·物联网", q: "关于物联网三层架构，下列对应正确的是（　）。",
    o: ["感知层是物联网识别物体、采集信息的来源；网络层是整个物联网的中枢；应用层是物联网和用户的接口","感知层是整个物联网的中枢；网络层负责识别物体和采集信息","应用层是整个物联网的中枢；网络层是物联网和用户的接口","网络层是物联网识别物体、采集信息的来源；应用层负责传递和处理感知层获取的信息"], a: 0,
    e: "教材 2.2.1 原文：感知层由各种传感器构成，包括温度传感器、二维码标签、RFID 标签和读写器、摄像头、GPS 等感知终端，【感知层是物联网识别物体、采集信息的来源】；网络层由各种网络（互联网、广电网、网络管理系统和云计算平台等）组成，【是整个物联网的中枢，负责传递和处理感知层获取的信息】；【应用层是物联网和用户的接口】，与行业需求结合以实现物联网的智能应用。口诀：感知采集 → 网络传递处理 → 应用落地。" },
  { m: "A·物联网", q: "下列设备中，不属于物联网感知层的是（　）。",
    o: ["摄像头","以太网交换机","二维码标签","温度传感器"], a: 1,
    e: "这是 2023 上半年真题原题。教材明确感知层的感知终端包括【温度传感器、二维码标签、RFID 标签和读写器、摄像头、GPS】等，【以太网交换机】是网络层设备，不属于感知层。答题口诀：能「感知物理世界」的都是感知层；做「数据传输转发」的是网络层。" },
  { m: "A·物联网", q: "关于射频识别技术（RFID），下列表述错误的是（　）。",
    o: ["RFID 是物联网中使用的一种传感器技术","RFID 可通过无线电信号识别特定目标并读写相关数据，无须识别系统与特定目标之间建立机械或光学接触","RFID 技术让物品能够「开口说话」，赋予了物联网可跟踪性","RFID 是物联网中独立的通信技术，与传感器技术、传感网并列，不属于物联网关键技术之一"], a: 3,
    e: "教材 2.2.1「关键技术」原文：物联网关键技术主要涉及【传感器技术、传感网和应用系统框架】等；其中【射频识别技术（Radio Frequency Identification，RFID）是物联网中使用的一种传感器技术】，可通过无线电信号识别特定目标并读写相关数据，而【无须识别系统与特定目标之间建立机械或光学接触】；【RFID 技术让物品能够「开口说话」】，这就赋予了物联网一个特性——【可跟踪性】。D 把 RFID 从「传感器技术」里拆出来变成独立技术，与教材不符。" },
  { m: "A·物联网", q: "关于物联网的关键技术与产业链，下列表述错误的是（　）。",
    o: ["微机电系统（MEMS）由微传感器、微执行器、信号处理和控制电路、通信接口和电源等部件组成","物联网应用系统框架是一种以机器终端智能交互为核心的、网络化的应用与服务，涉及机器、传感器硬件、通信网络、中间件和应用 5 个重要技术部分","物联网的产业链包括传感器和芯片、设备、网络运营及服务、软件与应用开发和系统集成","MEMS 的核心作用是替代传感器，让物联网不再需要独立的感知终端"], a: 3,
    e: "MEMS 原文：微机电系统（Micro-Electro-Mechanical Systems，MEMS）是由【微传感器、微执行器、信号处理和控制电路、通信接口和电源】等部件组成的【一体化的微型器件系统】；其目标是把信息的【获取、处理和执行集成在一起】。它【赋予了普通物体新的『生命』】，使它们有了属于自己的数据传输通路、存储功能、操作系统和专门应用程序，从而形成一个【庞大的传感网】——是「增强」，不是「替代」传感器（D 错）。应用系统框架五部分＝【机器、传感器硬件、通信网络、中间件、应用】；产业链五环节＝【传感器和芯片、设备、网络运营及服务、软件与应用开发、系统集成】。" },
  // 模块B 云计算 (6-10)
  { m: "B·云计算", q: "关于云计算的定义与服务特征，下列表述正确的是（　）。",
    o: ["云计算是一种基于互联网的计算方式，将共享的软件资源、计算资源、存储资源和信息资源按需求提供给网上的终端设备和终端用户","云计算只提供计算资源和存储资源两种资源","云计算实现了「固定、包月、无弹性」的服务，资源不能动态扩展","云计算的用户必须自行采购并维护底层硬件设备"], a: 0,
    e: "教材 2.2.2 原文：云计算是一种【基于互联网的计算方式】，通过这种方式将网络上配置为共享的【软件资源、计算资源、存储资源和信息资源】，按需求提供给网上的终端设备和终端用户；云计算实现了「【快速、按需、弹性】」的服务，用户可以随时通过宽带网络接入「云」并获得服务，按照实际需求获取或释放资源，根据需求对资源进行动态扩展。B 少了两种资源；C 把「快速、按需、弹性」说反；D 与「无须自建底层硬件」相反。" },
  { m: "B·云计算", q: "按照云计算服务提供的资源层次，向用户提供虚拟的操作系统、数据库管理系统、Web 应用等平台化服务的是（　）。",
    o: ["PaaS 平台即服务","IaaS 基础设施即服务","SaaS 软件即服务","DaaS 数据即服务"], a: 0,
    e: "教材原文：按照云计算服务提供的资源层次，可分为三种服务类型——【IaaS 基础设施即服务】向用户提供计算机能力、存储空间等基础设施方面的服务；【PaaS 平台即服务】向用户提供【虚拟的操作系统、数据库管理系统、Web 应用等平台化】的服务；【SaaS 软件即服务】向用户提供应用软件（如 CRM、办公软件等）、组件、工作流等虚拟化软件的服务（SaaS 一般采用 Web 技术和 SOA 架构）。题干关键词「虚拟的操作系统、数据库管理系统、Web 应用」直接对应 PaaS。口诀：I 搭硬件 · P 搭平台 · S 直接用软件。" },
  { m: "B·云计算", q: "下列云服务与层级的对应，错误的是（　）。",
    o: ["在线办公软件、CRM —— SaaS","租用虚拟机、云硬盘 —— IaaS","云数据库、应用开发运行环境 —— PaaS","虚拟化操作系统、数据库管理系统 —— IaaS"], a: 3,
    e: "三个反向陷阱（教材分层口径）：①【在线办公软件 / CRM】属【SaaS】（交付可直接使用的成品应用软件）；②【租用虚拟机 / 存储空间】属【IaaS】（交付基础设施能力）；③【虚拟的操作系统、数据库管理系统、Web 应用】属【PaaS】（交付平台化运行环境）。D 把典型的 PaaS 内容说成 IaaS，错。判别法：看服务商交付什么——交付服务器/存储→IaaS；交付开发运行环境→PaaS；交付可直接用的应用软件→SaaS。" },
  { m: "B·云计算", q: "关于虚拟化技术，下列表述错误的是（　）。",
    o: ["多任务是指在一个操作系统中多个程序同时并行运行","虚拟化技术中可以同时运行多个操作系统，每一个操作系统都运行在一个虚拟的 CPU 或者虚拟主机上","超线程技术只是单 CPU 模拟双 CPU 来平衡程序运行性能，这两个模拟出来的 CPU 是不能分离的，只能协同工作","容器技术属于硬件虚拟化，目前最受欢迎的容器环境是 Docker"], a: 3,
    e: "教材原文：虚拟化技术与多任务以及超线程技术是完全不同的。【多任务】是指在一个操作系统中多个程序同时并行运行；而在【虚拟化技术】中，则可以同时运行多个操作系统，而且每一个操作系统中都有多个程序运行，每一个操作系统都运行在一个虚拟的 CPU 或者虚拟主机上；【超线程技术】只是单 CPU 模拟双 CPU 来平衡程序运行性能，这两个模拟出来的 CPU 是不能分离的，只能协同工作。【容器（Container）技术是一种全新意义上的虚拟化技术，属于操作系统虚拟化的范畴】（由操作系统提供虚拟化的支持），目前最受欢迎的容器环境是 Docker。D 把「操作系统虚拟化」错写为「硬件虚拟化」。" },
  { m: "B·云计算", q: "关于云计算的关键技术，下列表述错误的是（　）。",
    o: ["云计算的关键技术主要涉及虚拟化技术、云存储技术、多租户和访问控制管理、云安全技术","分布式文件系统是云存储技术中的重要组成部分，在维持兼容性的基础上对系统复制和容错功能进行提升","基于 ABE 密码机制的云计算访问控制包括 4 个参与方：数据提供者、可信第三方授权中心、云存储服务器和用户","云安全研究只包含云计算技术本身的安全保护工作，不涉及借助云服务保障客户端用户的安全防护需求"], a: 3,
    e: "教材原文：云计算的关键技术主要涉及【虚拟化技术、云存储技术、多租户和访问控制管理、云安全技术】；【分布式文件系统作为云存储技术中的重要组成部分】…；【基于 ABE 密码机制的云计算访问控制包括 4 个参与方：数据提供者、可信第三方授权中心、云存储服务器和用户】（2023 下半年真题原题）。【云安全研究主要包含两个方面的内容】：一是云计算技术本身的安全保护工作（数据完整性及可用性、隐私保护性及服务可用性）；二是借助于云服务的方式来保障客户端用户的安全防护需求（基于云计算的病毒防治、木马检测技术等）。D 只保留了第一个方面，错。" },
  // 模块C 大数据 (11-14)
  { m: "C·大数据", q: "关于大数据的定义，下列表述正确的是（　）。",
    o: ["大数据指无法在一定时间范围内用常规软件工具进行捕捉、管理和处理的数据集合，是具有更强的决策力、洞察发现力和流程优化能力的海量、高增长率和多样化的信息资产","大数据的定义落点是「数据集」，强调的是数据的规模而非价值属性","大数据从数据源到最终价值实现只需要经过数据存储与管理一个过程","大数据处理不需要新型计算架构和智能算法，沿用传统软件工具即可"], a: 0,
    e: "教材原文：大数据（Big Data）指【无法在一定时间范围内用常规软件工具进行捕捉、管理和处理的数据集合】，是具有更强的【决策力、洞察发现力和流程优化能力】的【海量、高增长率和多样化的信息资产】（落点是「信息资产」）。大数据从数据源到最终价值实现一般需要经过【数据准备、数据存储与管理、数据分析和计算、数据治理和知识展现】四个过程；大数据是具有体量大、结构多样、时效性强等特征的数据，【处理大数据需要采用新型计算架构和智能算法等新技术】。" },
  { m: "C·大数据", q: "教材所述大数据的主要特征中，「大数据区分于传统数据挖掘的最显著特征」是（　）。",
    o: ["数据处理速度快","数据价值密度低","数据海量","数据类型多样"], a: 0,

let idx = 0, score = 0, answers = [], current = QUESTIONS, locked = false;

function initAll() {
  idx = 0; score = 0; answers = []; current = QUESTIONS.slice();
  document.getElementById("quiz").style.display = "block";
  document.getElementById("result").style.display = "none";
  renderQ();
}
function renderQ() {
  locked = false;
  const q = current[idx];
  document.getElementById("pbar").style.width = (idx / current.length * 100) + "%";
  let html = '<div class="card"><span class="qtag">' + q.m + '</span><span class="qno">第 ' + (idx+1) + ' / ' + current.length + ' 题</span>';
  html += '<div class="qtext">' + q.q + '</div>';
  q.o.forEach((t, i) => { html += '<button class="opt" data-i="' + i + '"><span class="mark">' + "ABCD"[i] + '</span>' + t + '</button>'; });
  html += '<div class="explain" id="ex"><b>精讲：</b>' + q.e + '</div>';
  html += '<button class="btn" id="next" disabled>' + (idx === current.length-1 ? "查看结果" : "下一题 (Enter)") + '</button></div>';
  document.getElementById("quiz").innerHTML = html;
  document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i)));
  document.getElementById("next").addEventListener("click", next);
}
function choose(i) {
  if (locked) return; locked = true;
  const q = current[idx], ok = i === q.a;
  if (ok) score++;
  answers[idx] = { ok, q };
  document.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === q.a) b.classList.add("right");
    else if (j === i) b.classList.add("wrong");
  });
  document.getElementById("ex").style.display = "block";
  document.getElementById("next").disabled = false;
}
function next() {
  if (idx < current.length - 1) { idx++; renderQ(); }
  else finish();
}
function finish() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("pbar").style.width = "100%";
  const res = document.getElementById("result");
  res.style.display = "block";
  document.getElementById("finalScore").textContent = score + " / " + current.length;
  const pct = Math.round(score / current.length * 100);
  document.getElementById("advice").textContent =
    pct >= 80 ? "✅ 达标（≥80%），2.2 六大新一代信息技术模块已过关，可进入 2.3 本章练习做整章串联重测！" :
    pct >= 60 ? "🔶 接近达标：回看错题对应模块的清单条目，重点补「IaaS/PaaS/SaaS 分层」「大数据四特征」「区块链四大类与七特征」「专家系统六部分」「VR 五特征」五组，明天重测。" :
    "❌ 未达标：请重读《2.2_知识点清单》的表格部分后重新测验。2.2 每年必出 3~5 题，这一节值得多花一天。";
  // 分模块统计
  const mods = {};
  current.forEach((q, i) => {
    mods[q.m] = mods[q.m] || { t: 0, r: 0 };
    mods[q.m].t++;
    if (answers[i] && answers[i].ok) mods[q.m].r++;
  });
  let rows = "";
  Object.keys(mods).forEach(m => {
    const st = mods[m].r / mods[m].t >= 0.8 ? "✅" : "🔶";
    rows += '<tr><td class="module-stat">' + m + '</td><td>' + mods[m].r + " / " + mods[m].t + '</td><td>' + st + '</td></tr>';
  });
  document.getElementById("moduleTable").innerHTML = '<tr><th>模块</th><th>正确率</th><th>状态</th></tr>' + rows;
  // 错题
  const wrongs = current.map((q, i) => ({ q, i })).filter(x => !answers[x.i] || !answers[x.i].ok);
  if (wrongs.length) {
    document.getElementById("reviewWrap").style.display = "block";
    document.getElementById("retryWrong").style.display = "inline-block";
    document.getElementById("reviewList").innerHTML = wrongs.map(x =>
      '<div class="wrong-item"><b>【' + x.q.m + '】</b>' + x.q.q +
      '<br>✔ 正确答案：<b>' + "ABCD"[x.q.a] + " · " + x.q.o[x.q.a] + '</b><br><span style="color:#666">' + x.q.e + '</span></div>'
    ).join("");
  } else {
    document.getElementById("reviewWrap").style.display = "none";
    document.getElementById("retryWrong").style.display = "none";
  }
}
document.getElementById("retryWrong").addEventListener("click", () => {
  current = current.filter((q, i) => !answers[i] || !answers[i].ok);
  idx = 0; score = 0; answers = [];
  document.getElementById("result").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  renderQ();
});
document.addEventListener("keydown", ev => {
  if (document.getElementById("result").style.display === "block") return;
  const k = ev.key.toUpperCase();
  const sel = "ABCD".indexOf(k);
  if (sel >= 0 && !locked) choose(sel);
  else if ((ev.key === "Enter" || k === "ENTER") && locked) next();
});
initAll();
</script>

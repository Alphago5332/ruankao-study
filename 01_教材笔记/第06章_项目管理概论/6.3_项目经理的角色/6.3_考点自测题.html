<script>
const QUESTIONS = [
{m:"6.3.1 定义",
 q:"关于项目经理的定义，正确的是（　）。",
 o:["项目经理由项目团队选举产生，负责带领团队实现项目目标",
    "项目经理由执行组织委派，负责领导团队实现项目目标",

{m:"6.3.1 定义",
 q:"「负责保证业务运营的高效性」描述的是（　）。",
 o:["项目经理","职能经理","项目发起人","运营经理"],a:3,
 e:"<b>三经理辨析</b>：运营经理 = 保证<b>业务运营的高效性</b>（对日常运转效率负责）；职能经理 = 对某个<b>职能领域或业务部门的管理监督</b>；项目经理 = 执行组织委派、领导团队实现项目目标。出题套路就是拿另外两句职责描述来混淆。"},
{m:"6.3.2 影响力范围",
 q:"项目经理的影响力范围涉及（　）层面的角色。",
 o:["5 个层面：项目、组织、行业、专业学科、跨领域",
    "3 个层面：项目、组织、行业",
    "6 个层面：项目、组织、行业、专业学科、跨领域、政府",
    "4 个层面：项目、组织、行业、跨领域"],a:0,
 e:"<b>教材 6.3.2 概述：项目经理会涉及项目、组织、行业、专业学科和跨领域范围内的角色</b>——记法「项·组·行·专·跨」，由内向外扩散。「政府」是干扰项，教材没有这个层面。这些角色反映项目经理的能力，体现其价值和作用。"},
{m:"6.3.2 影响力范围",
 q:"教材对项目层面「共识」的定义是（　）。",
 o:["全体干系人对项目决定 100% 赞同",
    "多数干系人投票通过即可执行",
    "即便不能做到 100% 赞同，干系人也会支持项目的决定和行动",
    "项目发起人拍板后干系人不得再有异议"],a:2,
 e:"项目经理使用<b>软技能</b>（人际关系技能、人员管理技能）平衡干系人相互冲突和竞争的目标，<b>以达成共识</b>。共识的教材定义 = <b>即便不能做到 100% 赞同，干系人也会支持项目的决定和行动</b>——「共识 = 全体一致同意」是高频错误项。"},
{m:"6.3.2 影响力范围",
 q:"关于项目经理的人际网络，正确的是（　）。",
 o:["正式人际网络（如组织架构图）比非正式的更重要",
    "项目经理发展、维护和培养的非正式人际网络更加重要",
    "非正式人际网络指组织架构图所体现的关系",
    "项目经理只需维护与团队成员的正式汇报关系"],a:1,
 e:"正式人际网络如<b>组织架构图</b>；非正式人际网络 = 与<b>专家和具有影响力的领导者</b>建立的个人人际关系。教材明确：项目经理发展、维护和培养的<b>非正式人际网络更加重要</b>——反向判断题高频。"},
{m:"6.3.2 影响力范围",
 q:"组织层面，其他独立项目可能因下列原因影响本项目，其中<b>不属于</b>教材所列原因的是（　）。",
 o:["团队成员的个人爱好与性格",
    "对相同资源的需求",
    "资金分配的优先顺序",
    "可交付成果的接受或发布"],a:0,
 e:"教材所列 4 个原因为：<b>①对相同资源的需求 ②资金分配的优先顺序 ③可交付成果的接受或发布 ④项目与组织战略和目标的一致性</b>——记法「资源·资金·成果·战略」。「团队成员个人爱好」不在列。"},
{m:"6.3.2 影响力范围",
 q:"项目经理「指导和教育其他专业人员（生产、市场、销售、财务等）了解项目管理方法对组织的价值」，属于影响力范围的（　）层面。",
 o:["专业学科","组织","行业","跨领域"],a:3,
 e:"<b>跨领域层面</b> = 指导和教育<b>其他领域的专业人员</b>学习掌握项目管理方法，还可担任<b>非正式的宣传大使</b>，宣传项目管理在按时交付、质量、创新和资源管理方面的优势。区分：专业学科 = 对「同行」分享知识、参与培训继续教育；行业 = 关注行业最新发展趋势。"},
{m:"6.3.3 三类技能",
 q:"项目经理需重点关注的三类关键技能不包括（　）。",
 o:["项目管理技能","领导力技能","技术研发技能","战略和商务管理技能"],a:2,
 e:"三类关键技能 = <b>项目管理技能、战略和商务管理技能、领导力技能</b>（「项·战·领」），需要<b>平衡</b>使用。「技术研发技能」不是教材所列；另注意别选 PMI 2022 新三角叫法（工作方式 / 商业敏锐度 / 权力技能），教材用老三角。"},
{m:"6.3.3 三类技能",
 q:"关于项目管理技能，下列说法<b>不正确</b>的是（　）。",
 o:["顶尖项目经理会针对每个项目裁剪，有选择地使用传统工具、敏捷工具、技术、方法",
    "项目管理技能仅指编制进度计划的能力",
    "要重点关注项目成功的关键因素、进度表、指定的财务报告和问题日志",
    "项目经理经常依赖专家判断来有效开展工作"],a:1,
 e:"项目管理技能 = <b>有效运用项目管理知识实现项目集或项目的预期成果的能力</b>，远不止编制进度计划。「关键项目管理要素」四件 = <b>成功关键因素、进度表、指定的财务报告、问题日志</b>；4 条关键技能记法「盯要素·会裁剪·定计划·控制约」。"},
{m:"6.3.3 三类技能",
 q:"战略和商务管理技能有助于项目经理（　）。",
 o:["提高绩效并取得更好的业务成果",
    "直接提高技术开发的效率",
    "替代组织高管制定公司战略",
    "保证项目团队的日常运营高效"],a:0,
 e:"教材定义：战略和商务管理技能是关于<b>行业和组织</b>的知识和专业技能，<b>有助于提高绩效并取得更好的业务成果</b>。三技能各自「帮助达成」要配对：项目管理→<b>项目目标</b>；战略和商务→<b>业务成果</b>；领导力→<b>业务目标</b>（帮助组织达成）。C 错——是「执行有利于战略调整和创新的决策及行动」，不是替代高管。"},
{m:"6.3.3 三类技能",
 q:"战略和商务管理技能涉及的「商业因素」中，财务类指标是（　）。",
 o:["干系人登记册与沟通计划",
    "团队绩效报告",
    "成本效益分析（净现值 NPV、投资回报率 ROI 等），包括各种可选方案",
    "项目审计报告"],a:2,
 e:"商业因素包括：<b>风险和问题 / 财务影响 / 成本效益分析（NPV、ROI 等，含各种可选方案）/ 业务价值 / 效益预期实现情况和战略 / 范围、预算、进度和质量</b>。NPV、ROI 与 6.2.3 项目成功标准的财务指标相呼应，别混章节。"},
{m:"6.3.3 领导力技能",
 q:"教材列举的领导力技能包括协商、抗压、（　）、解决问题、批判性思考和人际关系技能。",
 o:["投资决策","市场推广","合同索赔","沟通"],a:3,
 e:"领导力即能<b>指导、激励和带领团队</b>的能力，六项技能记法「<b>协·抗·沟·解·批·人</b>」= 协商、抗压、<b>沟通</b>、解决问题、批判性思考、人际关系技能。项目经理需运用领导力技能与<b>所有项目干系人</b>合作。"},
{m:"6.3.3 领导力技能",
 q:"占据项目经理工作绝大部分的是（　）。",
 o:["编写技术方案","人际交往","编制预算报表","风险建模"],a:1,
 e:"教材原话：<b>人际交往占据项目经理工作的绝大部分</b>，项目经理需要<b>研究人的行为和动机</b>，尽力成为一个好的领导者，并借助人际关系让项目相关事项得到落实。「PM 最主要的工作是技术攻关」是高频错误判断。"},
{m:"6.3.3 政策与权力",
 q:"「地位」权力在教材中有时又称为（　）。",
 o:["正式的、权威的、合法的",
    "专家的、经验的",
    "参考的、信任的",
    "情境的、临时的"],a:0,
 e:"<b>地位权力有时称为正式的、权威的、合法的</b>——指组织或团队授予的<b>正式职位</b>。这是权力部分最高频的辨析：地位 ↔ 正式/权威/合法是同一权力的别称，不是四种不同权力。"},
{m:"6.3.3 政策与权力",
 q:"项目经理因「他人的尊重和赞赏」而获得信任，这种权力的表现形式是（　）。",

 e:"<b>参考权力 = 因为他人的尊重和赞赏而获得的信任</b>。区分：专家 = 拥有的技能和信息、经验、培训、教育、证书；情境 = 在<b>危机等特殊情况</b>下获得的权力；奖励相关 = 给予表扬、金钱或其他奖励。"},
{m:"6.3.3 政策与权力",

const LETTERS = ["A","B","C","D"];
let pool = [], cur = 0, answered = false, stats = {}, wrongList = [];

function init(list){
  pool = list.map(x=>Object.assign({},x));
  cur = 0; answered = false; stats = {}; wrongList = [];
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  document.getElementById("totalNow").textContent = pool.length;
  document.getElementById("scoreNow").textContent = "0";
  render();
}
function render(){
  const q = pool[cur];
  document.getElementById("pos").textContent = "第 " + (cur+1) + " / " + pool.length + " 题";
  document.getElementById("moduleChip").textContent = q.m;
  document.getElementById("bar").style.width = (cur/pool.length*100) + "%";
  document.getElementById("qtext").innerHTML = q.q;
  const box = document.getElementById("options");
  box.innerHTML = "";
  q.o.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "opt";
    d.innerHTML = '<span class="tag">'+LETTERS[i]+'</span><span>'+t+"</span>";
    d.onclick = ()=>choose(i);
    box.appendChild(d);
  });
  document.getElementById("feedback").classList.add("hidden");
}
function choose(i){
  if(answered) return;
  answered = true;
  const q = pool[cur];
  const ok = (i === q.a);
  if(!stats[q.m]) stats[q.m] = {right:0,total:0};
  stats[q.m].total++;
  const opts = document.querySelectorAll(".opt");
  opts.forEach((d,idx)=>{
    d.classList.add("locked");
    if(idx === q.a) d.classList.add("correct");
    else if(idx === i) d.classList.add("wrong");
    else d.classList.add("dim");
    d.onclick = null;
  });
  if(ok){
    stats[q.m].right++;
    document.getElementById("scoreNow").textContent = sumRight();
  } else {
    wrongList.push({q:q, picked:i});
  }
  const v = document.getElementById("verdict");
  v.textContent = ok ? "✓ 答对了" : "✗ 答错了　正确答案：" + LETTERS[q.a];
  v.className = ok ? "" : "bad";
  document.getElementById("explain").innerHTML = q.e;
  document.getElementById("feedback").classList.remove("hidden");
  document.getElementById("nextBtn").textContent =
    (cur === pool.length-1) ? "查看成绩单 →" : "下一题 →";
}
function sumRight(){
  let s = 0; for(const k in stats) s += stats[k].right; return s;
}
function next(){
  cur++;
  if(cur >= pool.length){ showResult(); }
  else { answered = false; render(); window.scrollTo(0,0); }
}
function showResult(){
  document.getElementById("quiz").classList.add("hidden");
  const r = document.getElementById("result");
  const total = pool.length, right = sumRight();
  const pct = Math.round(right/total*100);
  let msg;
  if(pct >= 80) msg = "达标（≥80%）：本节知识点基本闭环，可以进入下一节，或用康奈尔模板的「遮」字诀再过一遍线索栏。";
  else if(pct >= 60) msg = "接近达标：把下面的错题解析看完，回看对应模块的知识点清单，明天用康奈尔模板遮住答案重测。";
  else msg = "未达标：正确率低是发现漏洞的正常信号——先把知识点清单的「必背」块过一遍，再点「只重做错题」。";

  let tbl = '<h3>分模块得分</h3><table><tr><th>模块</th><th>正确 / 题数</th><th>正确率</th></tr>';
  for(const k in stats){
    const s = stats[k];
    const p = Math.round(s.right/s.total*100);
    tbl += '<tr><td>'+k+'</td><td>'+s.right+' / '+s.total+'</td><td><div class="mbar"><div style="width:'+p+'%"></div></div></td></tr>';
  }
  tbl += "</table>";

  let wrong = "";
  if(wrongList.length){
    wrong = "<h3>错题回顾（"+wrongList.length+" 题）</h3>";
    wrongList.forEach((w,i)=>{
      wrong += '<div class="wq"><div class="wt">'+(i+1)+". "+w.q.q+"</div>"
        + '<div class="wa">你的选择：'+LETTERS[w.picked]+"　"+w.q.o[w.picked]+"</div>"
        + '<div class="wc">正确答案：'+LETTERS[w.q.a]+"　"+w.q.o[w.q.a]+"</div>"
        + '<div class="we">'+w.q.e+"</div></div>";
    });
  } else {
    wrong = '<h3>错题回顾</h3><p style="font-size:13px;color:#0F6E56;">全部答对，本节知识点已闭环。</p>';
  }

  r.innerHTML =
    '<div class="r-head"><div class="r-score">'+right+"<small> / "+total+"</small></div>"
    + '<div class="r-msg"><b>'+pct+"%</b><br>"+msg+"</div></div>"
    + tbl + wrong
    + '<div class="btns">'
    + '<button class="btn primary" id="retryWrong"'+(wrongList.length?"":" disabled")+">只重做错题（"+wrongList.length+" 题）</button>"
    + '<button class="btn" id="retryAll">全部重来</button></div>';
  r.classList.remove("hidden");
  document.getElementById("retryWrong").onclick = ()=>{
    const list = wrongList.map(w=>w.q);
    init(list);
    window.scrollTo(0,0);
  };
  document.getElementById("retryAll").onclick = ()=>{ init(QUESTIONS); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = next;
document.addEventListener("keydown", e=>{
  if(document.getElementById("quiz").classList.contains("hidden")) return;
  if(e.key === "Enter" || e.key === " "){ if(answered){ e.preventDefault(); next(); } return; }
  const map = {"a":0,"b":1,"c":2,"d":3,"1":0,"2":1,"3":2,"4":3};
  const k = e.key.toLowerCase();
  if(k in map && !answered) choose(map[k]);
});
init(QUESTIONS);
</script>

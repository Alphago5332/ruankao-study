<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1.2 现代化基础设施 · 考点自测题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #333; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  header { background: #185FA5; color: #fff; border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; }
  header h1 { font-size: 19px; margin-bottom: 4px; }
  header p { font-size: 12.5px; opacity: .85; }
  .progress-bar { background: rgba(255,255,255,.25); border-radius: 4px; height: 8px; margin-top: 10px; }
  .progress-bar i { display: block; height: 100%; background: #ffc53d; border-radius: 4px; width: 0; transition: width .3s; }
  .card { background: #fff; border-radius: 8px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .qtag { font-size: 11px; color: #854F0B; background: #fff7e6; border: 1px solid #f0d9a0; border-radius: 3px; padding: 1px 6px; margin-right: 6px; }
  .qno { font-weight: bold; color: #185FA5; }
  .qtext { font-size: 14.5px; line-height: 1.65; margin: 8px 0 12px; }
  .opt { display: block; width: 100%; text-align: left; border: 1px solid #d9e2ec; border-radius: 6px;
    background: #fff; padding: 9px 12px; font-size: 13.5px; margin-bottom: 8px; cursor: pointer; line-height: 1.5; }
  .opt:hover { border-color: #185FA5; }
  .opt.sel { border-color: #185FA5; background: #eef4fb; }
  .opt.right { border-color: #2e7d32; background: #eef7ee; }
  .opt.wrong { border-color: #c62828; background: #fdeeee; }
  .opt .mark { font-weight: bold; margin-right: 6px; color: #185FA5; }
  .explain { display: none; background: #f4f8fc; border-left: 3px solid #185FA5; border-radius: 4px;
    padding: 10px 12px; font-size: 13px; line-height: 1.7; color: #444; margin-top: 4px; }
  .explain b { color: #185FA5; }
  .btn { background: #185FA5; color: #fff; border: none; border-radius: 6px; padding: 9px 22px;
    font-size: 14px; cursor: pointer; margin-top: 10px; }
  .btn.gray { background: #90a4ae; }
  .btn:disabled { background: #b0bec5; cursor: not-allowed; }
  #result { display: none; text-align: center; }
  #result .big { font-size: 40px; font-weight: bold; color: #185FA5; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 14px 0; }
  th, td { border: 1px solid #d9e2ec; padding: 7px 8px; text-align: center; }
  th { background: #eef4fb; color: #185FA5; }
  .module-stat td:first-child { text-align: left; }
  #reviewList { text-align: left; }
  .wrong-item { border: 1px solid #f0c4c4; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; background: #fffafa; }
  .wrong-item b { color: #c62828; }
  .kbd-tip { font-size: 11.5px; color: #999; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>1.2 现代化基础设施 · 考点自测（20 题）</h1>
    <p>第 4 版教材 1.2 节 · 达标线 16/20（80%）· 键盘 A~D 选择，Enter 确认</p>
    <div class="progress-bar"><i id="pbar"></i></div>
  </header>
  <div id="quiz"></div>
  <div id="result" class="card">
    <h2>测验完成</h2>
    <div class="big" id="finalScore">0 / 20</div>
    <div id="advice" style="font-size:14px; margin-bottom: 6px;"></div>
    <table class="module-stat" id="moduleTable">
      <tr><th>模块</th><th>正确率</th><th>状态</th></tr>
    </table>
    <div id="reviewWrap" style="display:none">
      <h3 style="color:#c62828; font-size:14px; margin-bottom:8px;">错题回顾</h3>
      <div id="reviewList"></div>
    </div>
    <button class="btn" id="retryWrong" style="display:none">只重做错题</button>
    <button class="btn gray" onclick="initAll()">重新测验</button>
  </div>
  <div class="kbd-tip">对照资料：同目录《1.2_知识点清单.md》· 教材出处：《信息系统项目管理师教程（第4版）》P7~P12</div>
</div>

<script>
const QUESTIONS = [
  // 模块A 新基建 (1-6)
  { m: "A·新基建", q: "新型基础设施建设以新发展理念为引领，以（　）为驱动，以信息网络为基础。",
    o: ["人工智能","技术创新","工业互联网","数字经济"], a: 1,
    e: "固定搭配：引领=新发展理念、驱动=技术创新、基础=信息网络（2024上真题）。" },
  { m: "A·新基建", q: "下列属于融合基础设施的是（　）。",
    o: ["科教基础设施","算力基础设施","智能交通基础设施","人工智能基础设施"], a: 2,
    e: "融合基础设施重在「应用新」：智能交通、智慧能源基础设施。科教→创新；算力、人工智能→信息（2025上真题）。" },
  { m: "A·新基建", q: "信息基础设施凸显的特点是（　）。",
    o: ["应用新","平台新","技术新","模式新"], a: 2,
    e: "口诀：信息=技术新、融合=应用新、创新=平台新。" },
  { m: "A·新基建", q: "下列全部属于信息基础设施中「新技术基础设施」的一组是（　）。",
    o: ["5G、物联网","人工智能、云计算、区块链","数据中心、智能计算中心","特高压、充电桩"], a: 1,
    e: "信息基础设施三小类：通信网络（5G/物联网/工业互联网/卫星互联网）、新技术（AI/云计算/区块链）、算力（数据中心/智能计算中心）。特高压、充电桩属新基建七大领域但不属信息基础设施。" },
  { m: "A·新基建", q: "创新基础设施强调「平台新」，主要包括（　）。",
    o: ["重大科技、科教、产业技术创新基础设施","智能交通、智慧能源基础设施","5G、卫星互联网","数据中心、智能计算中心"], a: 0,
    e: "创新基础设施=具有公益属性的基础设施：重大科技、科教、产业技术创新。B 是融合，C 是通信网络，D 是算力。" },
  { m: "A·新基建", q: "卫星互联网在新基建三大方面中归属于（　）。",
    o: ["算力基础设施","通信网络基础设施","新技术基础设施","创新基础设施"], a: 1,
    e: "通信网络基础设施四代表：5G、物联网、工业互联网、卫星互联网（口诀：五物工卫）。" },
  // 模块B 工业互联网 (7-14)
  { m: "B·工业互联网", q: "工业互联网是新一代信息通信技术与工业经济深度融合的新型基础设施、应用模式和（　）。",
    o: "工业生态|生产关系|商业形态|管理体系".split("|"), a: 0,
    e: "教材定义：新型基础设施、应用模式和工业生态三位一体，是第四次工业革命的重要基石。" },
  { m: "B·工业互联网", q: "工业互联网平台体系四大层级：网络是基础、平台是中枢、（　）、安全是保障。",
    o: ["数据是核心","数据是要素","信息是要素","数据是血脉"], a: 1,
    e: "必背口诀「网平数安 / 基中素保」：网络基础、平台中枢、数据要素、安全保障。" },
  { m: "B·工业互联网", q: "工业互联网网络体系包括（　）三部分。",
    o: ["网络互联、数据互通、标识解析","接入网、骨干网、城域网","IT网络、OT网络、CT网络","采集、传输、存储"], a: 0,
    e: "网络是基础：网络互联（数据传输）、数据互通（标准化+统一建模）、标识解析（标记/管理/定位）。" },
  { m: "B·工业互联网", q: "标识解析体系由（　）组成。",
    o: ["标识编码、标识解析系统、标识数据服务","编码、解码、加密","物理标识、逻辑标识、虚拟标识","企业标识、行业标识、国家标识"], a: 0,
    e: "教材原文：标识编码、标识解析系统、标识数据服务三部分。" },
  { m: "B·工业互联网", q: "工业互联网平台体系包括（　）四个层级，相当于工业互联网的「操作系统」。",
    o: ["边缘层、IaaS、PaaS、SaaS","感知层、网络层、平台层、应用层","设备层、车间层、工厂层、供应链层","数据层、模型层、服务层、应用层"], a: 0,
    e: "注意区分：B 是物联网架构，C 是智能制造层级。工互平台=边缘→IaaS→PaaS→SaaS，四大作用：数据汇聚、建模分析、知识复用、应用创新。" },
  { m: "B·工业互联网", q: "工业互联网数据的三个特性是（　）。",
    o: ["重要性、专业性、复杂性","海量性、时效性、多样性","完整性、可靠性、安全性","静态性、动态性、开放性"], a: 0,
    e: "口诀「重专复」。价值在于分析，分析依赖行业知识和工业机理。" },
  { m: "B·工业互联网", q: "工业互联网安全具有的三大特点是（　）。",
    o: ["涉及范围广、造成影响大、企业防护基础弱","攻击手段多、防御成本高、恢复周期长","病毒多、漏洞多、黑客多","范围小、影响小、防护强"], a: 0,
    e: "口诀「广、大、弱」。核心任务：监测预警、应急响应、检测评估、功能测试。" },
  { m: "B·工业互联网", q: "企业从单纯出售产品向出售「产品+服务」转变（如设备健康管理、产品远程运维、融资租赁），属于工业互联网六大典型应用模式中的（　）。",
    o: ["平台化设计","服务化延伸","数字化管理","网络化协同"], a: 1,
    e: "服务化延伸：从加工组装向价值链两端高附加值环节延伸。六大模式口诀「设造制定延管」：平台化设计、智能化制造、网络化协同、个性化定制、服务化延伸、数字化管理。" },
  // 模块C 车联网 (15-20)
  { m: "C·车联网", q: "车联网（IoV）系统是一个（　）三层体系。",
    o: ["端、管、云","云、边、端","感、传、智","车、路、人"], a: 0,
    e: "必背：端（智能传感器）—管（互联互通）—云（车辆运行信息平台）。" },
  { m: "C·车联网", q: "车联网管系统解决的互联互通不包括（　）。",
    o: ["车与车","车与路","车与厂","车与人"], a: 2,
    e: "管系统解决车与车、车与路、车与网、车与人的互联互通；实现车辆自组网及异构网络通信与漫游；是公网与专网的统一体。" },
  { m: "C·车联网", q: "车联网端系统是汽车的（　），负责采集与获取车辆的智能信息，感知行车状态与环境。",
    o: ["智能传感器","导航模块","娱乐主机","行车记录仪"], a: 0,
    e: "端系统=智能传感器；同时是具有车内通信、车间通信、车网通信的泛在通信终端；具备 IoV 寻址和网络可信标识能力。" },
  { m: "C·车联网", q: "车联网的链接方式不包括（　）。",
    o: ["车与云平台","车内设备之间","车与车","车与工厂"], a: 3,
    e: "五种链接方式：车与云平台、车与车、车与路、车与人、车内设备。口诀「云端+三外一内」。" },
  { m: "C·车联网", q: "借助地面道路固定通信设施实现车辆与道路间的信息交流，用于监测路面状况、引导最佳行驶路径，属于（　）通信。",
    o: ["车与云平台","车与车","车与路","车与人"], a: 2,
    e: "车与路=地面道路固定通信设施。车与云=卫星无线/移动蜂窝；车与人=Wi-Fi/蓝牙/蜂窝。" },
  { m: "C·车联网", q: "智能网联汽车可实现「安全、高效、（　）、节能」行驶。",
    o: ["环保","舒适","经济","快速"], a: 1,
    e: "教材原文四词：安全、高效、舒适、节能。通读级考点。" }
];

let idx = 0, score = 0, answers = [], current = QUESTIONS, locked = false;

function initAll() {
  idx = 0; score = 0; answers = []; current = QUESTIONS.slice();
  document.getElementById("quiz").style.display = "block";
  document.getElementById("result").style.display = "none";
  renderQ();
}
function renderQ() {
  locked = false;
  const q = current[idx];
  document.getElementById("pbar").style.width = (idx / current.length * 100) + "%";
  let html = '<div class="card"><span class="qtag">' + q.m + '</span><span class="qno">第 ' + (idx+1) + ' / ' + current.length + ' 题</span>';
  html += '<div class="qtext">' + q.q + '</div>';
  q.o.forEach((t, i) => { html += '<button class="opt" data-i="' + i + '"><span class="mark">' + "ABCD"[i] + '</span>' + t + '</button>'; });
  html += '<div class="explain" id="ex"><b>精讲：</b>' + q.e + '</div>';
  html += '<button class="btn" id="next" disabled>' + (idx === current.length-1 ? "查看结果" : "下一题 (Enter)") + '</button></div>';
  document.getElementById("quiz").innerHTML = html;
  document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i)));
  document.getElementById("next").addEventListener("click", next);
}
function choose(i) {
  if (locked) return; locked = true;
  const q = current[idx], ok = i === q.a;
  if (ok) score++;
  answers[idx] = { ok, q };
  document.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === q.a) b.classList.add("right");
    else if (j === i) b.classList.add("wrong");
  });
  document.getElementById("ex").style.display = "block";
  document.getElementById("next").disabled = false;
}
function next() {
  if (idx < current.length - 1) { idx++; renderQ(); }
  else finish();
}
function finish() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("pbar").style.width = "100%";
  const res = document.getElementById("result");
  res.style.display = "block";
  document.getElementById("finalScore").textContent = score + " / " + current.length;
  const pct = Math.round(score / current.length * 100);
  document.getElementById("advice").textContent =
    pct >= 80 ? "✅ 达标（≥80%），可进入下一节打卡！" :
    pct >= 60 ? "🔶 接近达标：回看错题对应模块的知识点清单，明天重测。" :
    "❌ 未达标：请重读《1.2_知识点清单》后重新测验。";
  // 分模块统计
  const mods = {};
  current.forEach((q, i) => {
    mods[q.m] = mods[q.m] || { t: 0, r: 0 };
    mods[q.m].t++;
    if (answers[i] && answers[i].ok) mods[q.m].r++;
  });
  let rows = "";
  Object.keys(mods).forEach(m => {
    const st = mods[m].r / mods[m].t >= 0.8 ? "✅" : "🔶";
    rows += '<tr><td class="module-stat">' + m + '</td><td>' + mods[m].r + " / " + mods[m].t + '</td><td>' + st + '</td></tr>';
  });
  document.getElementById("moduleTable").innerHTML = '<tr><th>模块</th><th>正确率</th><th>状态</th></tr>' + rows;
  // 错题
  const wrongs = current.map((q, i) => ({ q, i })).filter(x => !answers[x.i] || !answers[x.i].ok);
  if (wrongs.length) {
    document.getElementById("reviewWrap").style.display = "block";
    document.getElementById("retryWrong").style.display = "inline-block";
    document.getElementById("reviewList").innerHTML = wrongs.map(x =>
      '<div class="wrong-item"><b>【' + x.q.m + '】</b>' + x.q.q +
      '<br>✔ 正确答案：<b>' + "ABCD"[x.q.a] + " · " + x.q.o[x.q.a] + '</b><br><span style="color:#666">' + x.q.e + '</span></div>'
    ).join("");
  } else {
    document.getElementById("reviewWrap").style.display = "none";
    document.getElementById("retryWrong").style.display = "none";
  }
}
document.getElementById("retryWrong").addEventListener("click", () => {
  current = current.filter((q, i) => !answers[i] || !answers[i].ok);
  idx = 0; score = 0; answers = [];
  document.getElementById("result").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  renderQ();
});
document.addEventListener("keydown", ev => {
  if (document.getElementById("result").style.display === "block") return;
  const k = ev.key.toUpperCase();
  const sel = "ABCD".indexOf(k);
  if (sel >= 0 && !locked) choose(sel);
  else if ((ev.key === "Enter" || k === "ENTER") && locked) next();
});
initAll();
</script>
</body>
</html>

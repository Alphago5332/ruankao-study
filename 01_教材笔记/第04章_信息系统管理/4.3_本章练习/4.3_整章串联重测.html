<script>
const QUESTIONS = [
{m:"A·管理基础",
 q:"教材对信息系统的定义：信息系统是对信息进行（　　），形成组织中的信息流动和处理，必要时能向有关人员提供有用信息的系统。",
 o:["采集、传输、计算、控制和输出","采集、处理、存储、管理和检索","收集、分类、汇总、分析和归档","感知、编码、存储、转发和展示"],a:1,
 e:"教材 4.1.1：信息系统对信息进行【采集、处理、存储、管理和检索】（五个动词口诀「采处存管检」），是由【人、技术、流程和数据资源】组成的【人机系统】。"},

{m:"A·管理基础",
 q:"在信息系统层次架构（教材图 4-1）中，「监督系统的设计和结构，并监控其整体性能」的职责属于（　　）。",
 o:["信息系统层","人员·技术·流程·数据（四要素）层","管理","基础设施层"],a:2,
 e:"层次架构从上往下三层：【管理 → 信息系统 → 人员/技术/流程/数据（四要素）】。信息系统之上是【管理】，它【监督系统的设计和结构】并【监控其整体性能】——这两个动词是管理层的，不是信息系统层的。"},

{m:"A·管理基础",
 q:"信息系统管理覆盖四大领域。针对信息系统解决方案的「定义、采购和实施，以及它们与业务流程的整合」属于（　　）。",
 o:["规划和组织","设计和实施","运维和服务","优化和持续改进"],a:1,
 e:"四大领域「规设运优」的落点：【设计和实施】= 解决方案的定义、采购和实施 + 与业务流程的整合——题干含「采购」「与业务流程整合」就选它；出现「一致性管理」的是优化和持续改进；运维和服务含「安全」；规划和组织管「整体组织、战略和支持活动」。"},

{m:"B·规划和组织",
 q:"信息系统战略三角突出三者之间的必要一致性，下列不属于三角构成的是（　　）。",
 o:["信息技术基础设施","业务战略","组织机制","信息系统"],a:0,
 e:"信息系统战略三角 =【业务战略、信息系统、组织机制】三边。核心句：成功的组织有一个【压倒一切的业务战略】，可推动组织机制和信息系统的有机融合——「压倒一切」修饰的是业务战略，别选错主体。"},

{m:"B·规划和组织",
 q:"波特竞争力优势模型的三种战略中，「通常一个行业中只存在一个成本引领者」描述的是（　　）。",
 o:["差异性战略","总成本领先战略","专注战略","专注差异化"],a:1,
 e:"【总成本领先战略】：成为市场上成本最低的生产者，通过最大限度降低成本获得高于平均水平的绩效，产品或服务质量须与业内相当；【一个行业中通常只存在一个成本引领者】。专注战略限窄细分市场，两种变体 = 专注成本 + 专注差异化，可实现区域（局部）竞争优势。"},

{m:"B·规划和组织",
 q:"组织机制战略对应的莱维特钻石模型，其四个要素是（　　）。",
 o:["硬件、软件、网络、数据","人员、技术、流程、数据","业务、组织、技术、治理","任务、结构、信息与控制、人员"],a:3,
 e:"【莱维特钻石（组织机制战略）】= 任务、结构、信息与控制、人员。⚠ 本章有四套「要素组」别混：矩阵框架（信息系统战略）= 硬件/软件/网络/数据；信息系统四要素（4.1.1）= 人/技术/流程/数据；运维能力建设四要素（4.2.2）= 人员/过程/技术/资源。配对口诀「业务看波特 · 组织看莱维特 · 信息系统看矩阵」。"},

{m:"B·规划和组织",
 q:"信息系统战略的矩阵框架用来理解组织必须做出的与信息系统相关的决策，其四大基础结构是（　　）。",
 o:["硬件、软件、网络、数据","任务、结构、信息与控制、人员","人员、过程、技术、资源","数据、算法、知识、平台"],a:0,
 e:"矩阵框架四大基础结构 =【硬件、软件、网络、数据】，核心是明确每类组件的「有什么 · 谁使用 · 在哪里」。信息系统战略是组织用来【提供信息服务的计划】，信息系统支撑组织实施其业务战略。"},

{m:"C·设计和实施",
 q:"信息系统设计和实施的设计方法包含三步，正确的顺序是（　　）。",
 o:["从战略到系统架构 → 从系统架构到系统设计 → 转换框架","从系统架构到系统设计 → 从战略到系统架构 → 转换框架","转换框架 → 从战略到系统架构 → 从系统架构到系统设计","从战略到系统架构 → 转换框架 → 从系统架构到系统设计"],a:0,
 e:"设计方法三步递进：①【从战略到系统架构】（业务战略 → 更具体的目标 → 业务需求 → 系统要求、标准和流程的更详细视图）；②【从系统架构到系统设计】（继承架构并添加实际的硬件、数据、网络和软件细节）；③【转换框架】（三问：内容/人员/位置）。箭头方向别接反。"},

{m:"C·设计和实施",
 q:"信息系统具有三个级别。为跨组织边界的服务对象、供应商或其他利益干系人的沟通交流奠定基础的是（　　）。",
 o:["全局级别","应用级","系统级","组织间级别"],a:3,
 e:"三级别：【全局级别】侧重整个组织、构成整个组织的信息环境；【组织间级别】为跨组织边界的服务对象、供应商或其他利益干系人的沟通交流奠定基础；【应用级】考虑特定业务应用时重点考虑数据库和程序组件及其运行的设备和操作环境。"},

{m:"C·设计和实施",
 q:"转换框架为信息系统的每个组件提出三类问题，下列不属于的是（　　）。",
 o:["内容","人员","成本","位置"],a:2,
 e:"转换框架三问 =【内容 · 人员 · 位置】。「内容」最常被问到（组件是什么、确定特定类型的技术）；「人员」了解涉及哪些个人、团体和部门（单个用户并非系统的所有者，系统也可能由组织租赁，此时所有者成为外部一方）；「位置」了解各组件所在位置。没有「成本」这一问。"},

{m:"C·设计和实施",
 q:"关于信息系统体系架构的三种常见模式（教材表 4-3），下列表述正确的是（　　）。",
 o:["「基于 Web 的架构」是与集中式、分布式、SOA 并列的第四种架构模式","集中式架构的别称术语是「基于服务器的架构」","面向服务的系统架构（SOA）的别称术语是「基于 Web 的架构」","分布式架构更适合业务本身高度集中的场景"],a:2,
 e:"三种模式及别称：集中式（别称【主机架构】，业务高度集中、需要易管理时用）；分布式（别称【基于服务器的架构】，担心可伸缩性、模块化有帮助、业务非集中化时用——分布式比集中式更模块化）；SOA（别称【基于 Web 的架构】，敏捷、可重用性、组件化、快速设计迭代时用）。⚠「基于 Web 的架构」是 SOA 的别称，不是第四种模式。"},

{m:"D·运维和服务",
 q:"信息系统的运维和服务主要包括八项活动，下列不属于的是（　　）。",
 o:["运行管理和控制","需求管理","IT 服务管理","介质控制"],a:1,
 e:"八项活动 = 运行管理和控制 · IT 服务管理 · 运行与监控 · 终端侧管理 · 程序库管理 · 安全管理 · 介质控制 · 数据管理（口诀「运服监终程安介数」）。「需求管理」不在八项之列。"},

{m:"D·运维和服务",
 q:"IT 服务管理（共 11 项活动）中，针对重复出现的同类事件做根因分析、防止复发的是（　　）。",
 o:["事件管理","变更管理","服务级别管理","问题管理"],a:3,
 e:"固定配对：【事件管理】= 处理计划外的服务中断或质量下降，核心是快速恢复服务（治标）；【问题管理】= 针对重复出现的同类事件做根因分析、防止复发（治本）。11 项从服务台起、可用性管理止；容量管资源够不够、可用性管能不能用、连续性管灾后快速恢复。"},

{m:"D·运维和服务",
 q:"运行管理和控制的四个主要活动是（　　）。",
 o:["计划、执行、检查、处理","服务台、事件、问题、变更","采集、处理、存储、检索","过程开发、标准制定、资源分配、过程管理"],a:3,
 e:"运行管理和控制四活动 =【过程开发 + 标准制定 + 资源分配 + 过程管理】。B 是戴明环 PDCA；C 是 IT 服务管理的活动。另记：运行与监控中检测和报告的错误四类 = 系统/程序/通信/操作员错误（「系程通操」）；程序库管理五功能 = 访问控制/签出/签入/版本控制/代码分析。"},

{m:"E·优化和持续改进",
 q:"关于六西格玛五阶段方法 DMAIC 与 DMADV 的转换关系，正确的是（　　）。",
 o:["第 1、2 阶段的「定义、度量」替换后即完成转换","DMAIC 用于设计新产品或过程，DMADV 用于现有过程改进","当第 4 阶段「改进」替换为「设计」、第 5 阶段「控制」替换为「验证」时，DMAIC 转变为 DMADV","两者是同一方法的两种译名，无实质区别"],a:2,
 e:"五阶段 = 定义 · 度量 · 分析 · 改进/设计 · 控制/验证。【替换只发生在第 4、5 阶段】（改进→设计、控制→验证）。适用区别：【DMAIC 识别消除现有过程缺陷根因 · DMADV 设计新产品或过程】。五阶段法是对戴明环 PDCA 四阶段周期的延伸。"},

{m:"E·优化和持续改进",
 q:"六西格玛五阶段中，「SIPOC 分析」与「价值流分析」分别属于（　　）。",
 o:["均属定义阶段","均属分析阶段","SIPOC 属定义阶段，价值流分析属分析阶段","SIPOC 属度量阶段，价值流分析属改进阶段"],a:2,
 e:"【SIPOC】（供方-输入-流程-输出-服务对象）是定义阶段「核心流程定义」的首选工具；【价值流分析】是分析阶段三目标之一（另两个：异常源头分析、确定优化改进的驱动因素）。另记：质量始于度量；良好度量系统五特性 = 准确 · 可重复 · 线性 · 可重现 · 稳定；定义阶段团队通常 5~7 名核心成员。"},

{m:"F·数据管理",
 q:"教材对数据管理的定义：数据管理是指通过（　　）数据和信息资产的职能，包括开发、执行和监督有关数据的计划、策略、方案、项目、流程、方法和程序。",
 o:["采集、存储与加工","治理、审计与评估","组织、协调与交付","规划、控制与提供"],a:3,
 e:"定义抓三个职能动词【规划 · 控制 · 提供】，价值动作五类【获取 · 控制 · 保护 · 交付 · 提高】。DAMA = 国际数据管理协会，指出数据资源管理致力于发展和处理组织数据全生命周期的适当的构建、策略、实践和程序。"},

{m:"F·数据管理",
 q:"DCMM（GB/T 36073）定义了 8 个核心能力域，下列不属于的是（　　）。",
 o:["数据仓库","数据战略","数据架构","数据质量"],a:0,

const LETTERS = ["A","B","C","D"];
let pool = [], cur = 0, answered = false, stats = {}, wrongList = [];

function init(list){
  pool = list.map(x=>Object.assign({},x));
  cur = 0; answered = false; stats = {}; wrongList = [];
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  document.getElementById("totalNow").textContent = pool.length;
  document.getElementById("scoreNow").textContent = "0";
  render();
}
function render(){
  const q = pool[cur];
  document.getElementById("pos").textContent = "第 " + (cur+1) + " / " + pool.length + " 题";
  document.getElementById("moduleChip").textContent = q.m;
  document.getElementById("bar").style.width = (cur/pool.length*100) + "%";
  document.getElementById("qtext").innerHTML = q.q;
  const box = document.getElementById("options");
  box.innerHTML = "";
  q.o.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "opt";
    d.innerHTML = '<span class="tag">'+LETTERS[i]+'</span><span>'+t+"</span>";
    d.onclick = ()=>choose(i);
    box.appendChild(d);
  });
  document.getElementById("feedback").classList.add("hidden");
}
function choose(i){
  if(answered) return;
  answered = true;
  const q = pool[cur];
  const ok = (i === q.a);
  if(!stats[q.m]) stats[q.m] = {right:0,total:0};
  stats[q.m].total++;
  const opts = document.querySelectorAll(".opt");
  opts.forEach((d,idx)=>{
    d.classList.add("locked");
    if(idx === q.a) d.classList.add("correct");
    else if(idx === i) d.classList.add("wrong");
    else d.classList.add("dim");
    d.onclick = null;
  });
  if(ok){
    stats[q.m].right++;
    document.getElementById("scoreNow").textContent = sumRight();
  } else {
    wrongList.push({q:q, picked:i});
  }
  const v = document.getElementById("verdict");
  v.textContent = ok ? "✓ 答对了" : "✗ 答错了　正确答案：" + LETTERS[q.a];
  v.className = ok ? "" : "bad";
  document.getElementById("explain").innerHTML = q.e;
  document.getElementById("feedback").classList.remove("hidden");
  document.getElementById("nextBtn").textContent =
    (cur === pool.length-1) ? "查看成绩单 →" : "下一题 →";
}
function sumRight(){
  let s = 0; for(const k in stats) s += stats[k].right; return s;
}
function next(){
  cur++;
  if(cur >= pool.length){ showResult(); }
  else { answered = false; render(); window.scrollTo(0,0); }
}
function showResult(){
  document.getElementById("quiz").classList.add("hidden");
  const r = document.getElementById("result");
  const total = pool.length, right = sumRight();
  const pct = Math.round(right/total*100);
  let msg;
  if(pct >= 80) msg = "达标（≥80%）：本节知识点基本闭环，可以进入下一节，或用康奈尔模板的「遮」字诀再过一遍线索栏。";
  else if(pct >= 60) msg = "接近达标：把下面的错题解析看完，回看对应模块的知识点清单，明天用康奈尔模板遮住答案重测。";
  else msg = "未达标：正确率低是发现漏洞的正常信号——先把知识点清单的「必背」块过一遍，再点「只重做错题」。";

  let tbl = '<h3>分模块得分</h3><table><tr><th>模块</th><th>正确 / 题数</th><th>正确率</th></tr>';
  for(const k in stats){
    const s = stats[k];
    const p = Math.round(s.right/s.total*100);
    tbl += '<tr><td>'+k+'</td><td>'+s.right+' / '+s.total+'</td><td><div class="mbar"><div style="width:'+p+'%"></div></div></td></tr>';
  }
  tbl += "</table>";

  let wrong = "";
  if(wrongList.length){
    wrong = "<h3>错题回顾（"+wrongList.length+" 题）</h3>";
    wrongList.forEach((w,i)=>{
      wrong += '<div class="wq"><div class="wt">'+(i+1)+". "+w.q.q+"</div>"
        + '<div class="wa">你的选择：'+LETTERS[w.picked]+"　"+w.q.o[w.picked]+"</div>"
        + '<div class="wc">正确答案：'+LETTERS[w.q.a]+"　"+w.q.o[w.q.a]+"</div>"
        + '<div class="we">'+w.q.e+"</div></div>";
    });
  } else {
    wrong = '<h3>错题回顾</h3><p style="font-size:13px;color:#0F6E56;">全部答对，本节知识点已闭环。</p>';
  }

  r.innerHTML =
    '<div class="r-head"><div class="r-score">'+right+"<small> / "+total+"</small></div>"
    + '<div class="r-msg"><b>'+pct+"%</b><br>"+msg+"</div></div>"
    + tbl + wrong
    + '<div class="btns">'
    + '<button class="btn primary" id="retryWrong"'+(wrongList.length?"":" disabled")+">只重做错题（"+wrongList.length+" 题）</button>"
    + '<button class="btn" id="retryAll">全部重来</button></div>';
  r.classList.remove("hidden");
  document.getElementById("retryWrong").onclick = ()=>{
    const list = wrongList.map(w=>w.q);
    init(list);
    window.scrollTo(0,0);
  };
  document.getElementById("retryAll").onclick = ()=>{ init(QUESTIONS); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = next;
document.addEventListener("keydown", e=>{
  if(document.getElementById("quiz").classList.contains("hidden")) return;
  if(e.key === "Enter" || e.key === " "){ if(answered){ e.preventDefault(); next(); } return; }
  const map = {"a":0,"b":1,"c":2,"d":3,"1":0,"2":1,"3":2,"4":3};
  const k = e.key.toLowerCase();
  if(k in map && !answered) choose(map[k]);
});
init(QUESTIONS);
</script>
</body>
</html>
